name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# The frozen, pip-free engine bundles (macOS .dmg, Linux and Windows zips,
# SHA256SUMS) are attached to the release by ci.yml's `release-assets` job on
# the same tag; this workflow adds the Python sdist and wheel for people who
# install the package into their own environment. Whichever workflow reaches
# the tag first creates the release; uploads never fail on an existing one.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
