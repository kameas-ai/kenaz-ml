name: CI

on:
  push:
    branches: [main]
    # two-client-engine-01MSK2EN WP08: a `v*` tag is a RELEASE build. The
    # notarization gate below cannot be skipped on one (Amendment A3.1).
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      plant_violation:
        # Evidence that the release gate can fail (WP08 T034 step 3). Run the
        # workflow manually with `unsigned_dylib` and the "Verify every nested
        # signature" step must go red; with `broken_health` the dmg spawn-smoke
        # must go red. Never set on a real release.
        description: "Planted violation to prove the gate fails (none | unsigned_dylib | broken_health)"
        required: false
        default: none

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Type check (pyrefly)
        # Zero findings is the bar: a real error fails this job. The cloud
        # extra is synced so the optional psycopg2/boto3 imports resolve.
        run: make typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke test — server + API endpoints
        run: |
          kenaz-ml serve --port 7799 &
          SERVER_PID=$!

          # Wait for the server to answer rather than guessing how long it takes.
          # The previous `sleep 3` raced startup: import time varies with runner
          # load and with what the dependency set pulls in, so the curl below
          # sometimes fired before the socket was listening and failed the job
          # for reasons unrelated to the change under test. A flaky gate teaches
          # people to ignore red, which is worse than having no gate.
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:7799/health; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::kenaz-ml serve exited before answering /health"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::kenaz-ml serve did not answer /health within 60s"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          # Health endpoint
          curl -sf http://127.0.0.1:7799/health | python -m json.tool

          # Predict endpoints
          curl -sf -X POST http://127.0.0.1:7799/predict/stuck \
            -H 'Content-Type: application/json' \
            -d '{"features": {"test_failure_count": 5, "time_in_phase_sec": 1200, "edit_velocity": 4.0, "file_switch_rate": 0.7, "session_length_sec": 3600, "time_since_last_commit_sec": 1800}}' \
            | python -m json.tool

          curl -sf -X POST http://127.0.0.1:7799/predict/suggest \
            -H 'Content-Type: application/json' \
            -d '{}' \
            | python -m json.tool

          curl -sf -X POST http://127.0.0.1:7799/predict/duration \
            -H 'Content-Type: application/json' \
            -d '{}' \
            | python -m json.tool

          curl -sf -X POST http://127.0.0.1:7799/predict/quality \
            -H 'Content-Type: application/json' \
            -d '{"features": {"test_pass_rate": 0.8, "test_total": 10, "edit_focus": 0.7, "velocity_ratio": 1.0, "commits_in_window": 2, "expected_commits": 1.0, "revert_count": 0, "edits_in_window": 20}}' \
            | python -m json.tool

          # Status endpoint
          curl -sf http://127.0.0.1:7799/status | python -m json.tool

          kill $SERVER_PID

      - name: Smoke test — CLI train (no-op without DB)
        run: |
          kenaz-ml train 2>&1 || true

      - name: Smoke test — CLI health-check (server not running)
        run: |
          kenaz-ml health-check 2>&1 && exit 1 || echo "Expected failure — server not running"

  openapi:
    name: OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify OpenAPI spec is up to date
        run: make openapi-check

  typewriter:
    name: Typewriter Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: typewriter/go.mod

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify generated types match typewriter/spec.yaml
        run: make typewriter-check

      - name: Test the Go module against the shared fixtures
        run: make typewriter-test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install from wheel
        # Deliberately NOT the lock: this is what an outside `pip install
        # kenaz-ml` gets, resolved from the wheel's own version ranges.
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
          echo "$RUNNER_TEMP/wheel-venv/bin" >> "$GITHUB_PATH"

      - name: Verify server starts from installed wheel
        run: |
          kenaz-ml serve --port 7798 &
          SERVER_PID=$!

          # Same bounded wait as the `test` job — this is the step that has been
          # failing this job on main. Installing from a wheel pulls the full
          # dependency set, so startup here is slower than in `test` and the
          # fixed `sleep 3` lost the race more often than it won it.
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:7798/health; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::kenaz-ml serve (from wheel) exited before answering /health"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::kenaz-ml serve (from wheel) did not answer /health within 60s"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          curl -sf http://127.0.0.1:7798/health | python -m json.tool
          curl -sf -X POST http://127.0.0.1:7798/predict/suggest \
            -H 'Content-Type: application/json' -d '{}' \
            | python -m json.tool
          kill $SERVER_PID

  # ==========================================================================
  # Frozen bundle — the packaging gate (WP05 T022; FR-011, FR-013, NFR-001,
  # NFR-003)
  # ==========================================================================
  # Runs on macOS arm64, the only platform where the notarization requirement
  # applies and the only freeze target for macOS per spec 069 LD-3.
  #
  # Two things this job is NOT allowed to conclude:
  #
  #   * "the build succeeded, therefore Feast is packaged correctly". Feast
  #     resolves providers and stores by string through
  #     `importlib.import_module`, which PyInstaller cannot see, so the failure
  #     shape is a bundle that builds and starts and then dies on the first
  #     feature call. The freeze smoke tests are what actually decide this: they
  #     run a real feature resolution inside the frozen binary, with its
  #     application directory made unwritable.
  #   * "the bundle is a reasonable size". The delta is printed on every build
  #     and gated, so drift is visible long before it breaches.
  freeze:
    name: Frozen bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 is the notarized .dmg lane (spec 069 LD-3); the other
          # targets ship as zips of the same onedir layout (a `kameas-ml/`
          # directory at the archive root, what the harness installer and
          # scripts/install.sh unpack).
          - os: macos-14
            target: darwin-arm64
            exe: kameas-ml
          - os: ubuntu-24.04
            target: linux-x86_64
            exe: kameas-ml
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: kameas-ml
          - os: windows-latest
            target: windows-x86_64
            exe: kameas-ml.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group freeze

      - name: Engine version
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(uv run python -c "from pathlib import Path; import sys; sys.path.insert(0, 'src'); from kenaz_ml._version import pyproject_version; print(pyproject_version(Path('pyproject.toml')) or '')")
          [ -n "$VERSION" ] || { echo "::error::could not read the engine version from pyproject.toml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release tag must match the pyproject version (A5)
        # pyproject.toml is the engine's single version source; the freeze
        # stamps it into VERSION files and /health reports it. A tag that
        # disagrees would ship a mislabelled engine, so it fails here.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYPROJECT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match pyproject.toml version ${PYPROJECT_VERSION}; bump pyproject before tagging"
            exit 1
          fi

      - name: Build frozen bundle
        # The same recipe `make freeze` runs (make is not on the Windows
        # runner). The spec applies the Feast registry at build time and
        # fails the build if the apply fails (D-001 / T019): a bundle without
        # a registry would start fine and fail at the first feature call on
        # a user's machine, so this must never degrade to a warning.
        run: uv run --group freeze pyinstaller freeze/kenaz-ml.spec --noconfirm --clean

      - name: Bundle-size gate (NFR-001)
        # Measured and gated on the notarized macOS lane, where every native
        # library is signable surface; the other targets report their size.
        env:
          # Size of the frozen onedir bundle immediately BEFORE this migration,
          # measured on macOS arm64 at commit ef67e05 (the last commit before
          # Feast entered pyproject.toml). Reproduce with:
          #
          #   git archive ef67e05 | tar -x -C /tmp/baseline
          #   cd /tmp/baseline && pip install -e ".[freeze]" \
          #     && pyinstaller freeze/kenaz-ml.spec --noconfirm --clean
          #   (that commit predates uv; today the equivalent is `make freeze`)
          #   du -sm dist/kameas-ml
          #
          # 126 MB / 210 native libraries. Update this only alongside a recorded
          # re-measurement; silently raising it to make a red build green is
          # exactly the drift the gate exists to catch.
          BASELINE_BUNDLE_MB: '126'
          # NFR-001: no more than 350 MB over the pre-migration set.
          GROWTH_CEILING_MB: '350'
          TARGET: ${{ matrix.target }}
        run: |
          BUNDLE_MB=$(du -sm dist/kameas-ml | cut -f1)
          LIBS=$(find dist/kameas-ml \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.pyd' \) | wc -l | tr -d ' ')
          DELTA_MB=$((BUNDLE_MB - BASELINE_BUNDLE_MB))
          HEADROOM_MB=$((GROWTH_CEILING_MB - DELTA_MB))

          {
            echo "### Frozen bundle size (${TARGET})"
            echo ""
            echo "| | value |"
            echo "|---|---|"
            echo "| bundle | ${BUNDLE_MB} MB |"
            echo "| pre-migration baseline (macOS arm64) | ${BASELINE_BUNDLE_MB} MB |"
            echo "| **delta** | **+${DELTA_MB} MB** |"
            echo "| NFR-001 ceiling | ${GROWTH_CEILING_MB} MB |"
            echo "| headroom | ${HEADROOM_MB} MB |"
            echo "| native libraries | ${LIBS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "bundle ${BUNDLE_MB} MB; baseline ${BASELINE_BUNDLE_MB} MB; delta +${DELTA_MB} MB; ceiling ${GROWTH_CEILING_MB} MB; ${LIBS} native libraries"

          if [ "$TARGET" = "darwin-arm64" ] && [ "$DELTA_MB" -gt "$GROWTH_CEILING_MB" ]; then
            echo "::error::bundle grew +${DELTA_MB} MB over the pre-migration baseline, past NFR-001's ${GROWTH_CEILING_MB} MB ceiling"
            exit 1
          fi

      - name: Freeze smoke tests — real feature call, read-only bundle, cold start
        # The gate that means something. Covers, on the actual artifact:
        #   * /predict/stuck through the frozen sklearn estimator path
        #   * the shipped registry, its producing-Feast-version marker (D-007)
        #   * a real Feast feature resolution with the application directory
        #     chmod'd unwritable, asserting nothing inside the bundle changed and
        #     that the online store landed in the user data directory (FR-013)
        #   * cold start against NFR-003's 10 s budget, on the real binary
        env:
          KENAZ_ML_FROZEN_BIN: ${{ github.workspace }}/dist/kameas-ml/${{ matrix.exe }}
        run: uv run pytest tests/test_frozen_smoke.py -v -s

      - name: Package the bundle
        # Linux and Windows ship as a zip whose root is the `kameas-ml/`
        # onedir (the same layout as the macOS .dmg volume). macOS is packaged
        # by the notarize job from the raw onedir artifact below.
        if: matrix.target != 'darwin-arm64'
        env:
          NAME: kenaz-ml-${{ steps.ver.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path kameas-ml -DestinationPath ../release/${NAME}.zip -CompressionLevel Optimal"
          else
            zip -qr "../release/${NAME}.zip" kameas-ml
          fi
          cd ..
          ls -l release

      - name: Upload frozen bundle (macOS onedir, for the notarize job)
        if: matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: kenaz-ml-macos-arm64
          path: dist/kameas-ml
          retention-days: 7

      - name: Upload packaged bundle
        if: matrix.target != 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: kenaz-ml-${{ matrix.target }}
          path: release/*.zip
          retention-days: 7

  # ==========================================================================
  # Notarization gate (WP05 T022; FR-012, NFR-005)
  # ==========================================================================
  # Feast takes the bundle from 210 to 435 Mach-O files, every one of which must
  # be signed with a hardened runtime and covered by a successful notarization
  # ticket. This job signs the bundle inside-out, notarizes it, staples the
  # ticket, and then VERIFIES rather than trusting the submission result:
  # `codesign --verify --deep --strict` and `xcrun stapler validate`.
  #
  # It requires Apple Developer credentials, which are repository secrets. When
  # they are absent the job reports plainly that the gate did not run instead of
  # passing vacuously — a green check that verified nothing is worse than a
  # missing one, and NFR-005 asks for a gate that is trustworthy, not one that
  # is merely green.
  #
  # Stapling targets a disk image rather than the bare onedir tree because
  # `stapler` can only attach a ticket to a container format (.app, .dmg, .pkg);
  # there is nowhere on a loose executable to put one. The .dmg is therefore the
  # distributable artifact, and it is what gets validated.
  #
  # Release semantics (two-client-engine-01MSK2EN WP08, Amendment A3.1): the
  # engine artifact IS this job's signed + notarized + stapled .dmg — a zip or
  # a bare onedir cannot carry a stapled ticket. On a RELEASE build (a `v*` tag)
  # missing Apple credentials is a hard FAILURE, never a "NOT RUN" skip. On a
  # non-release run (a push to main, a manual dispatch off a branch) the skip is
  # still allowed, is reported as NOT RUN, and can never satisfy the release
  # gate, because the release gate is this job on the tag's run. The freeze spec
  # is not involved: it keeps codesign_identity=None; CI signs, the freeze does
  # not.
  notarize:
    name: Notarization gate
    needs: freeze
    runs-on: macos-14
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
      PLANT_VIOLATION: ${{ github.event.inputs.plant_violation || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen bundle
        uses: actions/download-artifact@v4
        with:
          name: kenaz-ml-macos-arm64
          path: dist/kameas-ml

      - name: Restore executable bits
        # actions/upload-artifact does not preserve the executable bit.
        run: |
          chmod +x dist/kameas-ml/kameas-ml
          find dist/kameas-ml -name '*.dylib' -o -name '*.so' | xargs -I{} chmod +x {}

      - name: Check for signing credentials
        id: creds
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -n "$MACOS_SIGNING_IDENTITY" ] && [ -n "$AC_API_KEY_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release builds require credentials (A3.1 — fail, never skip)
        if: steps.creds.outputs.configured != 'true' && env.RELEASE_BUILD == 'true'
        run: |
          {
            echo "### Notarization gate: FAILED — release build without Apple credentials"
            echo ""
            echo "\`${GITHUB_REF}\` is a release build. The engine artifact is the signed +"
            echo "notarized + stapled .dmg this job produces, so it cannot be skipped here."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::release build ${GITHUB_REF} has no Apple Developer credentials; the notarized engine .dmg cannot be produced (FR-021, Amendment A3.1)"
          exit 1

      - name: Report that the gate did not run
        if: steps.creds.outputs.configured != 'true'
        run: |
          {
            echo "### Notarization gate: NOT RUN (non-release run — does NOT satisfy the release gate)"
            echo ""
            echo "Apple Developer credentials are not configured for this repository, so the"
            echo "bundle was neither signed, notarized, nor stapled. FR-012 and NFR-005 are"
            echo "**unverified** for this build."
            echo ""
            echo "Required repository secrets:"
            echo ""
            echo "| secret | purpose |"
            echo "|---|---|"
            echo "| \`MACOS_CERTIFICATE_P12\` | base64 of the Developer ID Application .p12 |"
            echo "| \`MACOS_CERTIFICATE_PASSWORD\` | password for that .p12 |"
            echo "| \`MACOS_SIGNING_IDENTITY\` | e.g. \`Developer ID Application: Example (TEAMID)\` |"
            echo "| \`AC_API_KEY_ID\` / \`AC_API_ISSUER_ID\` / \`AC_API_PRIVATE_KEY\` | App Store Connect API key for \`notarytool\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::notarization gate skipped — Apple Developer credentials are not configured; FR-012/NFR-005 are unverified for this build"

      - name: Import signing certificate
        if: steps.creds.outputs.configured == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm -f /tmp/certificate.p12

      - name: Sign the bundle inside-out
        if: steps.creds.outputs.configured == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Inside-out: every nested Mach-O first, the launcher last. Signing the
          # launcher before its dylibs invalidates the outer signature the moment
          # an inner one is written (ADR-nested-binary-signing).
          find dist/kameas-ml -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -n 25 codesign --force --timestamp --options runtime --sign "$IDENTITY"
          codesign --force --timestamp --options runtime --sign "$IDENTITY" dist/kameas-ml/kameas-ml
          echo "signed $(find dist/kameas-ml \( -name '*.so' -o -name '*.dylib' \) | wc -l | tr -d ' ') nested Mach-O files plus the launcher"

      - name: "Planted violation: strip one nested signature (evidence run only)"
        if: steps.creds.outputs.configured == 'true' && env.PLANT_VIOLATION == 'unsigned_dylib'
        run: |
          set -euo pipefail
          # -print -quit, not `| head -1`: under pipefail, head closing the pipe
          # early SIGPIPEs find and fails this step for the wrong reason.
          victim=$(find dist/kameas-ml -type f -name '*.dylib' -print -quit)
          [ -n "$victim" ] || { echo "::error::no dylib found to plant the violation on"; exit 1; }
          codesign --remove-signature "$victim"
          echo "::warning::PLANTED VIOLATION — removed the signature from $victim; the next step must fail"

      - name: Verify every nested signature before notarizing
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Fail here rather than at Apple's end: a single unsigned nested binary
          # is the documented way this fails with 435 of them, and the local
          # error names the file while the notarization log does not always.
          failed=0
          while IFS= read -r macho; do
            if ! codesign --verify --strict "$macho" 2>/dev/null; then
              echo "::error::unsigned or invalid signature: $macho"
              failed=1
            fi
          done < <(find dist/kameas-ml -type f \( -name '*.dylib' -o -name '*.so' \))
          codesign --verify --deep --strict --verbose=2 dist/kameas-ml/kameas-ml
          [ "$failed" -eq 0 ]

      - name: Notarize and staple
        if: steps.creds.outputs.configured == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_PRIVATE_KEY: ${{ secrets.AC_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ac
          echo "$AC_API_PRIVATE_KEY" > "/tmp/ac/AuthKey_${AC_API_KEY_ID}.p8"

          # A .dmg, because a ticket has to be stapled to a container.
          #
          # Layout contract (engine-publication-01ENPUB01 WP-M1): the harness
          # installer (kenaz-harness core/mlsidecar/dmg.go, EngineOnedirName)
          # requires a `kameas-ml/` DIRECTORY at the volume root and copies
          # that tree. `hdiutil -srcfolder` places the folder's CONTENTS at
          # the root, so the onedir is staged one level down first; passing
          # dist/kameas-ml directly produced a volume the installer refused.
          rm -rf /tmp/dmg-root && mkdir -p /tmp/dmg-root
          cp -R dist/kameas-ml /tmp/dmg-root/kameas-ml
          hdiutil create -volname kenaz-ml -srcfolder /tmp/dmg-root \
            -ov -format UDZO /tmp/kenaz-ml.dmg
          rm -rf /tmp/dmg-root

          # Prove the layout before spending a notarization round on it.
          MOUNT=$(hdiutil attach /tmp/kenaz-ml.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')
          if [ ! -d "$MOUNT/kameas-ml" ] || [ ! -x "$MOUNT/kameas-ml/kameas-ml" ] || [ ! -d "$MOUNT/kameas-ml/_internal" ]; then
            ls -la "$MOUNT"; hdiutil detach "$MOUNT" || true
            echo "::error::dmg layout is wrong: expected <root>/kameas-ml/{kameas-ml,_internal}; the harness installer would refuse this image"
            exit 1
          fi
          hdiutil detach "$MOUNT"

          xcrun notarytool submit /tmp/kenaz-ml.dmg \
            --key "/tmp/ac/AuthKey_${AC_API_KEY_ID}.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 45m
          xcrun stapler staple /tmp/kenaz-ml.dmg
          rm -rf /tmp/ac

      - name: Verify notarization (FR-012, NFR-005)
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # The submission result is not the gate; these three are. `--deep
          # --strict` walks the nested Mach-O files rather than trusting the
          # outer signature, `stapler validate` proves the ticket is attached
          # (so a machine offline at first launch still passes), and `spctl`
          # is the assessment Gatekeeper itself performs.
          codesign --verify --deep --strict --verbose=2 dist/kameas-ml/kameas-ml
          xcrun stapler validate /tmp/kenaz-ml.dmg
          spctl --assess --type open --context context:primary-signature -vv /tmp/kenaz-ml.dmg
          echo "### Notarization gate: PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv
        if: steps.creds.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify the notarized artifact serves a real feature call
        if: steps.creds.outputs.configured == 'true'
        # US4 acceptance scenario 3: it is not enough that the notarized artifact
        # verifies — it has to work when mounted from the distributable image,
        # with the application directory read-only, which is what a user gets.
        # The mounted volume is read-only by construction, so this is the
        # closest thing CI has to a clean-machine install.
        run: |
          set -euo pipefail
          uv sync --locked
          export PATH="$PWD/.venv/bin:$PATH"
          MOUNT=$(hdiutil attach /tmp/kenaz-ml.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')
          # `serves_health` (added by WP08) reuses test_frozen_binary_serves_health
          # and its launcher against the MOUNTED, notarized binary.
          KENAZ_ML_FROZEN_BIN="$MOUNT/kameas-ml/kameas-ml" pytest tests/test_frozen_smoke.py -v -s \
            -k "feature_store or registry_records or serves_health" || {
              hdiutil detach "$MOUNT" || true
              exit 1
            }
          hdiutil detach "$MOUNT"

      - name: Spawn the notarized artifact and verify /health identity + the lease lifecycle (FR-021)
        if: steps.creds.outputs.configured == 'true'
        # Repair R3's spawn-smoke half, on the artifact users actually receive:
        # the stapled .dmg, mounted read-only. Spawns the staged binary with a
        # temporary install root (never the runner's real directories) and a 1 s
        # lease sweep (the 600 s idle window keeps the timer from racing the
        # smoke), asserts the WP05 identity payload, then proves the
        # token-authorized shutdown really stops it. `spctl --assess` on the same
        # .dmg ran in "Verify notarization" above.
        run: |
          set -euo pipefail
          MOUNT=$(hdiutil attach /tmp/kenaz-ml.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          ROOT=$(mktemp -d)
          DATA=$(mktemp -d)
          mkdir -p "$ROOT/lease"
          TOKEN=$(uuidgen)
          printf '%s\n' "$TOKEN" > "$ROOT/lease/shutdown.token"
          chmod 600 "$ROOT/lease/shutdown.token"
          PORT=7797
          KENAZ_ML_INSTALL_ROOT="$ROOT" XDG_DATA_HOME="$DATA" \
            KENAZ_ML_IDLE_EXIT_SEC=600 KENAZ_ML_LEASE_SWEEP_SEC=1 \
            "$MOUNT/kameas-ml/kameas-ml" serve --host 127.0.0.1 --port "$PORT" > /tmp/spawn.log 2>&1 &
          PID=$!
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /tmp/health.json "http://127.0.0.1:$PORT/health"; then ready=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/spawn.log; echo "::error::the notarized binary exited before answering /health"; exit 1; fi
            sleep 1
          done
          [ -n "$ready" ] || { cat /tmp/spawn.log; echo "::error::the notarized binary never answered /health"; exit 1; }
          if [ "$PLANT_VIOLATION" = "broken_health" ]; then
            echo "::warning::PLANTED VIOLATION — corrupting the /health payload; this step must fail"
            echo '{}' > /tmp/health.json
          fi
          MOUNT="$MOUNT" python3 - <<'PY'
          import json, os
          body = json.load(open("/tmp/health.json"))
          required = ["product", "sidecar_version", "contract_versions", "exe_path", "engine_sha256",
                      "model_details", "device", "lifecycle_protocol"]
          missing = [k for k in required if k not in body]
          assert not missing, f"/health identity fields missing: {missing}"
          assert body["product"] == "kenaz-ml", body["product"]
          assert body["lifecycle_protocol"] == 1, body["lifecycle_protocol"]
          assert body["sidecar_version"], "empty sidecar_version"
          assert body["engine_sha256"] and len(body["engine_sha256"]) == 64, body["engine_sha256"]
          # A5: the version is real, stamped from pyproject.toml, carried in the
          # onedir-root VERSION file, and (on a tag) is the tag's version.
          version = body["sidecar_version"]
          assert version and version != "0+unknown", version
          root_file = open(os.path.join(os.environ["MOUNT"], "kameas-ml", "VERSION")).read().strip()
          assert root_file == version, (root_file, version)
          if os.environ.get("RELEASE_BUILD") == "true":
              assert version != "0.1.0", "release build still reports the placeholder 0.1.0"
              assert version == os.environ["GITHUB_REF_NAME"].removeprefix("v"), (version, os.environ["GITHUB_REF_NAME"])
          mount = os.path.realpath(os.environ["MOUNT"])
          assert os.path.realpath(body["exe_path"]).startswith(mount), (body["exe_path"], mount)
          print("identity OK:", {k: body[k] for k in ("product", "sidecar_version", "lifecycle_protocol", "exe_path")})
          PY
          # `--version` on the notarized launcher agrees with /health (A5).
          CLI_VERSION=$("$MOUNT/kameas-ml/kameas-ml" --version)
          HEALTH_VERSION=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['sidecar_version'])")
          [ "$CLI_VERSION" = "$HEALTH_VERSION" ] || { echo "::error::--version ($CLI_VERSION) != /health ($HEALTH_VERSION)"; exit 1; }
          # A wrong token must be refused and leave the engine running...
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer wrong" "http://127.0.0.1:$PORT/v1/admin/shutdown")
          [ "$code" = "403" ] || { echo "::error::wrong shutdown token answered $code, expected 403"; exit 1; }
          kill -0 "$PID" || { echo "::error::a refused shutdown stopped the engine"; exit 1; }
          # ...and the right one must stop it gracefully.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/v1/admin/shutdown")
          [ "$code" = "202" ] || { echo "::error::authorized shutdown answered $code, expected 202"; exit 1; }
          for _ in $(seq 1 30); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$PID" 2>/dev/null; then kill "$PID"; echo "::error::the engine did not exit after an authorized shutdown"; exit 1; fi
          echo "### Spawn-smoke on the notarized .dmg: PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload notarized disk image
        if: steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kenaz-ml-macos-arm64-notarized
          path: /tmp/kenaz-ml.dmg
          retention-days: 14

  # ==========================================================================
  # Publish (engine-publication-01ENPUB01 WP-M2)
  # ==========================================================================
  # Release builds only. Takes the signed + notarized + stapled .dmg the
  # notarize job produced, signs its MANIFEST with the release ed25519 key,
  # and publishes both to the release bucket behind the downloads CDN:
  #
  #   kenaz-ml/<ver>/kenaz-ml-<ver>-darwin-arm64.dmg
  #   kenaz-ml/<ver>/kenaz-ml-<ver>-darwin-arm64.dmg.sig
  #   kenaz-ml/index.json                      (informational, newest first)
  #
  # What is signed is NOT the .dmg bytes: it is the canonical bytes of the
  # harness's EngineManifest(version, artifact_path, sha256).SigningPayload(),
  # produced by the harness's own signer (kenaz-harness cmd/kenaz-ml-sign) at
  # a pinned ref. The harness rebuilds that manifest at install time from its
  # build-time pin, so the three inputs here must match the pin exactly:
  # the version string, the CHANNEL-RELATIVE artifact path (the bare file
  # name — the channel URL already carries kenaz-ml/<ver>), and the .dmg
  # sha256 as "sha256:<lowercase hex>". The .dmg is bound through that hash.
  # The signature file is the raw 64-byte detached ed25519 signature.
  #
  # Objects are immutable: an upload refuses to overwrite (If-None-Match: *),
  # and a key that already holds a DIFFERENT artifact fails the job. A re-run
  # after a partial publish is idempotent: an existing object with the same
  # sha256 is treated as already published. index.json is the one mutable
  # object and is rewritten (newest first = publish order) and invalidated on
  # the CDN; one publish runs at a time.
  #
  # Prerequisites that live outside this repository, each checked below and
  # reported as NOT RUN while absent (the release still succeeds — publication
  # is not yet part of the release gate; the notarized .dmg is still uploaded
  # as a workflow artifact):
  #   secret KENAZ_ML_RELEASE_SIGNING_KEY    the ed25519 private key file contents,
  #                                          on the `release` GitHub environment
  #   var    KENAZ_ML_RELEASE_PUBLIC_KEY     its public key (for the post-sign self-check)
  #   var    KENAZ_ML_RELEASE_ROLE_ARN       AWS role assumed via GitHub OIDC
  #   var    KENAZ_ML_RELEASE_BUCKET         e.g. kameas-ai-<env>-releases-use2
  #   var    KENAZ_ML_DOWNLOADS_DOMAIN       e.g. downloads.<env>.kameas.ai
  #   var    KENAZ_ML_CLOUDFRONT_DISTRIBUTION_ID
  #   env    HARNESS_SIGNER_REF (below)      the pinned kenaz-harness ref that ships the signer
  publish:
    name: Publish engine release
    needs: notarize
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # The signing key is a GitHub ENVIRONMENT secret (owner decision 2026-10-03):
    # without this declaration it is invisible to the job, and declaring it is
    # also what makes the OIDC token's `sub` claim read
    # `...:environment:release`, which the kameas-infra trust policy matches
    # on. Required reviewers on the environment gate the key. The name is a
    # cross-repo contract with kameas-infra; change it there first.
    environment: release
    # One publish at a time: index.json is a read-modify-write, and two close
    # tags must not interleave on it. Never cancel a publish in flight.
    concurrency:
      group: kenaz-ml-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # The kenaz-harness ref the signer is taken from. Empty until the signer
      # lands on the harness's main; set it to a full commit SHA and bump it
      # deliberately. Never a branch name: the bytes we sign with must be the
      # bytes we reviewed.
      HARNESS_SIGNER_REF: ''
      AWS_REGION: us-east-2
    steps:
      # Third-party actions in this job are pinned to commit SHAs (tag shown
      # in the comment): it handles the release signing key and release
      # credentials, so a moved tag must not be able to change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check publication prerequisites
        id: prereqs
        env:
          SIGNING_KEY: ${{ secrets.KENAZ_ML_RELEASE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.KENAZ_ML_RELEASE_PUBLIC_KEY }}
          ROLE_ARN: ${{ vars.KENAZ_ML_RELEASE_ROLE_ARN }}
          BUCKET: ${{ vars.KENAZ_ML_RELEASE_BUCKET }}
          DOMAIN: ${{ vars.KENAZ_ML_DOWNLOADS_DOMAIN }}
          DISTRIBUTION: ${{ vars.KENAZ_ML_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=()
          [ -n "$SIGNING_KEY" ]        || missing+=("environment secret KENAZ_ML_RELEASE_SIGNING_KEY (environment: release)")
          [ -n "$PUBLIC_KEY" ]         || missing+=("var KENAZ_ML_RELEASE_PUBLIC_KEY")
          [ -n "$ROLE_ARN" ]           || missing+=("var KENAZ_ML_RELEASE_ROLE_ARN")
          [ -n "$BUCKET" ]             || missing+=("var KENAZ_ML_RELEASE_BUCKET")
          [ -n "$DOMAIN" ]             || missing+=("var KENAZ_ML_DOWNLOADS_DOMAIN")
          [ -n "$DISTRIBUTION" ]       || missing+=("var KENAZ_ML_CLOUDFRONT_DISTRIBUTION_ID")
          [ -n "$HARNESS_SIGNER_REF" ] || missing+=("workflow env HARNESS_SIGNER_REF (pinned kenaz-harness signer ref)")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Publish: NOT RUN — release ${GITHUB_REF_NAME} was notarized but NOT published"
              echo ""
              echo "The signed .dmg exists only as the \`kenaz-ml-macos-arm64-notarized\` workflow artifact."
              echo "No harness or kenaz install can fetch this release until publication runs. Missing:"
              echo ""
              for m in "${missing[@]}"; do echo "- $m"; done
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::engine release ${GITHUB_REF_NAME} NOT published — missing: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download notarized disk image
        if: steps.prereqs.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kenaz-ml-macos-arm64-notarized
          path: release

      - name: Name and hash the artifact
        if: steps.prereqs.outputs.ready == 'true'
        id: artifact
        run: |
          set -euo pipefail
          # The version is the tag WITHOUT its leading v, everywhere: the file
          # name, the S3 prefix, index.json and the signed artifact_path. The
          # harness pin derives kenaz-ml-<ver>-darwin-arm64.dmg from the bare
          # version and rejects a leading v, so a name built from the raw tag
          # would sign a path the pin never asks for.
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT_BASENAME="kenaz-ml-${VERSION}-darwin-arm64.dmg"
          mv release/kenaz-ml.dmg "release/${ARTIFACT_BASENAME}"
          SHA=$(sha256sum "release/${ARTIFACT_BASENAME}" | cut -d' ' -f1)
          SIZE=$(stat -c %s "release/${ARTIFACT_BASENAME}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "basename=${ARTIFACT_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=sha256:${SHA}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "${ARTIFACT_BASENAME}: sha256:${SHA} (${SIZE} bytes)"

      - name: Check out the harness signer at its pinned ref
        if: steps.prereqs.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kameas-ai/kenaz-harness
          ref: ${{ env.HARNESS_SIGNER_REF }}
          path: .siblings/kenaz-harness

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.prereqs.outputs.ready == 'true'
        with:
          go-version-file: .siblings/kenaz-harness/go.mod
          cache-dependency-path: .siblings/kenaz-harness/go.sum

      - name: Build the signer (no key in the environment)
        if: steps.prereqs.outputs.ready == 'true'
        # Module download and compilation run without the signing key
        # present; only the already-built binary ever sees it.
        working-directory: .siblings/kenaz-harness
        run: go build -o "$RUNNER_TEMP/kenaz-ml-sign" ./cmd/kenaz-ml-sign

      - name: Sign the engine manifest and self-check the signature
        if: steps.prereqs.outputs.ready == 'true'
        id: sign
        env:
          KENAZ_ML_RELEASE_SIGNING_KEY: ${{ secrets.KENAZ_ML_RELEASE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.KENAZ_ML_RELEASE_PUBLIC_KEY }}
          VERSION: ${{ steps.artifact.outputs.version }}
          ARTIFACT_BASENAME: ${{ steps.artifact.outputs.basename }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          SIGNER="$RUNNER_TEMP/kenaz-ml-sign"
          # The signer reads the private key from KENAZ_ML_RELEASE_SIGNING_KEY
          # and prints {"key_id","version","artifact_path","sha256"}.
          "$SIGNER" sign \
            --version "$VERSION" \
            --artifact-path "$ARTIFACT_BASENAME" \
            --sha256 "$SHA256" \
            --out "release/${ARTIFACT_BASENAME}.sig" | tee release/sign.json
          [ "$(stat -c %s "release/${ARTIFACT_BASENAME}.sig")" -eq 64 ] \
            || { echo "::error::signature is not a raw 64-byte ed25519 signature"; exit 1; }
          # Self-check with the public key: the signer and the verifier must
          # agree on the canonical payload before anything is uploaded.
          printf '%s' "$PUBLIC_KEY" > "$RUNNER_TEMP/release.pub"
          "$SIGNER" verify \
            --pubkey "$RUNNER_TEMP/release.pub" \
            --sig "release/${ARTIFACT_BASENAME}.sig" \
            --version "$VERSION" \
            --artifact-path "$ARTIFACT_BASENAME" \
            --sha256 "$SHA256"
          echo "key_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["key_id"])' release/sign.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: steps.prereqs.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.KENAZ_ML_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the .dmg and its signature (immutable, idempotent)
        if: steps.prereqs.outputs.ready == 'true'
        env:
          BUCKET: ${{ vars.KENAZ_ML_RELEASE_BUCKET }}
          VERSION: ${{ steps.artifact.outputs.version }}
          ARTIFACT_BASENAME: ${{ steps.artifact.outputs.basename }}
        run: |
          set -euo pipefail
          PREFIX="kenaz-ml/${VERSION}"

          # Release objects are immutable, and a re-run after a partial publish
          # must be able to finish. For each object:
          #   * head-object 404            -> upload, atomically refusing to
          #                                   overwrite (If-None-Match: *), so
          #                                   there is no check-then-put window
          #   * head-object 200, same sha  -> already published; continue
          #   * head-object 200, other sha -> fail: a different artifact holds
          #                                   this version's name
          #   * any other head-object error -> fail: never treat 403, throttling
          #                                   or a network error as "absent"
          publish_object() {
            local file="$1" key="$2" content_type="$3"
            local sha b64 err
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            b64=$(openssl dgst -sha256 -binary "$file" | base64 -w0)
            if aws s3api head-object --bucket "$BUCKET" --key "$key" > "$RUNNER_TEMP/head.json" 2> "$RUNNER_TEMP/head.err"; then
              local remote
              remote=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("Metadata", {}).get("sha256", ""))' "$RUNNER_TEMP/head.json")
              if [ "$remote" = "$sha" ]; then
                echo "s3://${BUCKET}/${key} already published with the same sha256; continuing"
                return 0
              fi
              echo "::error::s3://${BUCKET}/${key} already exists with a different sha256 (${remote:-unrecorded}); release objects are immutable — tag a new version"
              return 1
            fi
            if ! grep -q "(404)" "$RUNNER_TEMP/head.err"; then
              echo "::error::could not determine whether s3://${BUCKET}/${key} exists:"; cat "$RUNNER_TEMP/head.err"
              return 1
            fi
            aws s3api put-object \
              --bucket "$BUCKET" --key "$key" --body "$file" \
              --if-none-match '*' \
              --checksum-sha256 "$b64" \
              --metadata "sha256=${sha}" \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable" > /dev/null
            echo "uploaded s3://${BUCKET}/${key} (sha256:${sha})"
          }
          publish_object "release/${ARTIFACT_BASENAME}"     "${PREFIX}/${ARTIFACT_BASENAME}"     application/x-apple-diskimage
          publish_object "release/${ARTIFACT_BASENAME}.sig" "${PREFIX}/${ARTIFACT_BASENAME}.sig" application/octet-stream

      - name: Update index.json and invalidate it on the CDN
        if: steps.prereqs.outputs.ready == 'true'
        env:
          BUCKET: ${{ vars.KENAZ_ML_RELEASE_BUCKET }}
          DOMAIN: ${{ vars.KENAZ_ML_DOWNLOADS_DOMAIN }}
          DISTRIBUTION: ${{ vars.KENAZ_ML_CLOUDFRONT_DISTRIBUTION_ID }}
          VERSION: ${{ steps.artifact.outputs.version }}
          ARTIFACT_BASENAME: ${{ steps.artifact.outputs.basename }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SIZE: ${{ steps.artifact.outputs.size }}
          KEY_ID: ${{ steps.sign.outputs.key_id }}
        run: |
          set -euo pipefail
          # Informational only: the harness build-time pin never reads this.
          # "Newest first" means publish order, not semver order.
          #
          # Start from an empty index ONLY when the object is confirmed
          # absent (NoSuchKey). Any other failure to read it fails the job:
          # a transient error must not turn into an index that lists only
          # this release.
          if ! aws s3api get-object --bucket "$BUCKET" --key kenaz-ml/index.json release/index.json > /dev/null 2> "$RUNNER_TEMP/index.err"; then
            if grep -q "NoSuchKey" "$RUNNER_TEMP/index.err"; then
              echo '{"name":"kenaz-ml","releases":[]}' > release/index.json
              echo "no kenaz-ml/index.json yet; starting one"
            else
              echo "::error::could not read the existing kenaz-ml/index.json; refusing to overwrite it:"; cat "$RUNNER_TEMP/index.err"
              exit 1
            fi
          fi
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = "release/index.json"
          index = json.load(open(path))
          version = os.environ["VERSION"]
          base = f"https://{os.environ['DOMAIN']}/kenaz-ml/{version}/{os.environ['ARTIFACT_BASENAME']}"
          entry = {
              "version": version,
              "released_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "darwin_arm64": {
                  "url": base,
                  "sha256": os.environ["SHA256"],
                  "size_bytes": int(os.environ["SIZE"]),
                  "sig_url": base + ".sig",
                  "key_id": os.environ["KEY_ID"],
              },
          }
          releases = [r for r in index.get("releases", []) if r.get("version") != version]
          index = {"name": "kenaz-ml", "releases": [entry, *releases]}
