name: CI

on:
  push:
    branches: [main]
    # two-client-engine-01MSK2EN WP08: a `v*` tag is a RELEASE build. The
    # notarization gate below cannot be skipped on one (Amendment A3.1).
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      plant_violation:
        # Evidence that the release gate can fail (WP08 T034 step 3). Run the
        # workflow manually with `unsigned_dylib` and the "Verify every nested
        # signature" step must go red; with `broken_health` the dmg spawn-smoke
        # must go red. Never set on a real release.
        description: "Planted violation to prove the gate fails (none | unsigned_dylib | broken_health)"
        required: false
        default: none

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Type check (pyrefly)
        # Zero findings is the bar: a real error fails this job. The cloud
        # extra is synced so the optional psycopg2/boto3 imports resolve.
        run: make typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke test — server + API endpoints
        run: |
          kenaz-ml serve --port 7799 &
          SERVER_PID=$!

          # Wait for the server to answer rather than guessing how long it takes.
          # The previous `sleep 3` raced startup: import time varies with runner
          # load and with what the dependency set pulls in, so the curl below
          # sometimes fired before the socket was listening and failed the job
          # for reasons unrelated to the change under test. A flaky gate teaches
          # people to ignore red, which is worse than having no gate.
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:7799/health; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::kenaz-ml serve exited before answering /health"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::kenaz-ml serve did not answer /health within 60s"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          # Health endpoint
          curl -sf http://127.0.0.1:7799/health | python -m json.tool

          # Predict endpoints
          curl -sf -X POST http://127.0.0.1:7799/predict/stuck \
            -H 'Content-Type: application/json' \
            -d '{"features": {"test_failure_count": 5, "time_in_phase_sec": 1200, "edit_velocity": 4.0, "file_switch_rate": 0.7, "session_length_sec": 3600, "time_since_last_commit_sec": 1800}}' \
            | python -m json.tool

          curl -sf -X POST http://127.0.0.1:7799/predict/suggest \
            -H 'Content-Type: application/json' \
            -d '{}' \
            | python -m json.tool

          curl -sf -X POST http://127.0.0.1:7799/predict/duration \
            -H 'Content-Type: application/json' \
            -d '{}' \
            | python -m json.tool

          curl -sf -X POST http://127.0.0.1:7799/predict/quality \
            -H 'Content-Type: application/json' \
            -d '{"features": {"test_pass_rate": 0.8, "test_total": 10, "edit_focus": 0.7, "velocity_ratio": 1.0, "commits_in_window": 2, "expected_commits": 1.0, "revert_count": 0, "edits_in_window": 20}}' \
            | python -m json.tool

          # Status endpoint
          curl -sf http://127.0.0.1:7799/status | python -m json.tool

          kill $SERVER_PID

      - name: Smoke test — CLI train (no-op without DB)
        run: |
          kenaz-ml train 2>&1 || true

      - name: Smoke test — CLI health-check (server not running)
        run: |
          kenaz-ml health-check 2>&1 && exit 1 || echo "Expected failure — server not running"

  openapi:
    name: OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify OpenAPI spec is up to date
        run: make openapi-check

  typewriter:
    name: Typewriter Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: typewriter/go.mod

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify generated types match typewriter/spec.yaml
        run: make typewriter-check

      - name: Test the Go module against the shared fixtures
        run: make typewriter-test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install from wheel
        # Deliberately NOT the lock: this is what an outside `pip install
        # kenaz-ml` gets, resolved from the wheel's own version ranges.
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
          echo "$RUNNER_TEMP/wheel-venv/bin" >> "$GITHUB_PATH"

      - name: Verify server starts from installed wheel
        run: |
          kenaz-ml serve --port 7798 &
          SERVER_PID=$!

          # Same bounded wait as the `test` job — this is the step that has been
          # failing this job on main. Installing from a wheel pulls the full
          # dependency set, so startup here is slower than in `test` and the
          # fixed `sleep 3` lost the race more often than it won it.
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:7798/health; then ready=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::kenaz-ml serve (from wheel) exited before answering /health"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::kenaz-ml serve (from wheel) did not answer /health within 60s"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          curl -sf http://127.0.0.1:7798/health | python -m json.tool
          curl -sf -X POST http://127.0.0.1:7798/predict/suggest \
            -H 'Content-Type: application/json' -d '{}' \
            | python -m json.tool
          kill $SERVER_PID

  # ==========================================================================
  # Frozen bundle — the packaging gate (WP05 T022; FR-011, FR-013, NFR-001,
  # NFR-003)
  # ==========================================================================
  # Runs on macOS arm64, the only platform where the notarization requirement
  # applies and the only freeze target for macOS per spec 069 LD-3.
  #
  # Two things this job is NOT allowed to conclude:
  #
  #   * "the build succeeded, therefore Feast is packaged correctly". Feast
  #     resolves providers and stores by string through
  #     `importlib.import_module`, which PyInstaller cannot see, so the failure
  #     shape is a bundle that builds and starts and then dies on the first
  #     feature call. The freeze smoke tests are what actually decide this: they
  #     run a real feature resolution inside the frozen binary, with its
  #     application directory made unwritable.
  #   * "the bundle is a reasonable size". The delta is printed on every build
  #     and gated, so drift is visible long before it breaches.
  freeze:
    name: Frozen bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 is the notarized .dmg lane (spec 069 LD-3); the other
          # targets ship as zips of the same onedir layout (a `kameas-ml/`
          # directory at the archive root, what the harness installer and
          # scripts/install.sh unpack).
          - os: macos-14
            target: darwin-arm64
            exe: kameas-ml
            mac_artifact: kenaz-ml-macos-arm64
          # Intel Macs: the harness ships a universal app, so the engine has to
          # run there too. This lane has no ONNX Runtime (no macOS x86_64
          # wheel for this Python; see pyproject.toml): classic kinds serve,
          # laya-bearing kinds refuse as on any ineligible host.
          - os: macos-15-intel
            target: darwin-x86_64
            exe: kameas-ml
            mac_artifact: kenaz-ml-macos-x86_64
            # GitHub's shared Intel runners start the frozen engine in ~10 s
            # (measured 9.7-10.1 s), right on NFR-003's line; the requirement
            # is enforced on the arm64 reference lane, this lane measures
            # against a wider gate so a regression still shows.
            cold_start_budget_sec: "20"
          - os: ubuntu-24.04
            target: linux-x86_64
            exe: kameas-ml
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: kameas-ml
          - os: windows-latest
            target: windows-x86_64
            exe: kameas-ml.exe
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write # Azure OIDC login for Windows code signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # uv installs the Python pinned in .python-version and the exact
        # dependency set in uv.lock; --locked fails if the lock is stale.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group freeze

      - name: Engine version
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(uv run python -c "from pathlib import Path; import sys; sys.path.insert(0, 'src'); from kenaz_ml._version import pyproject_version; print(pyproject_version(Path('pyproject.toml')) or '')")
          [ -n "$VERSION" ] || { echo "::error::could not read the engine version from pyproject.toml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release tag must match the pyproject version (A5)
        # pyproject.toml is the engine's single version source; the freeze
        # stamps it into VERSION files and /health reports it. A tag that
        # disagrees would ship a mislabelled engine, so it fails here.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYPROJECT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match pyproject.toml version ${PYPROJECT_VERSION}; bump pyproject before tagging"
            exit 1
          fi

      - name: Build frozen bundle
        # The same recipe `make freeze` runs (make is not on the Windows
        # runner). The spec applies the Feast registry at build time and
        # fails the build if the apply fails (D-001 / T019): a bundle without
        # a registry would start fine and fail at the first feature call on
        # a user's machine, so this must never degrade to a warning.
        run: uv run --group freeze pyinstaller freeze/kenaz-ml.spec --noconfirm --clean

      - name: Bundle-size gate (NFR-001)
        # Measured and gated on the notarized macOS lane, where every native
        # library is signable surface; the other targets report their size.
        env:
          # Size of the frozen onedir bundle immediately BEFORE this migration,
          # measured on macOS arm64 at commit ef67e05 (the last commit before
          # Feast entered pyproject.toml). Reproduce with:
          #
          #   git archive ef67e05 | tar -x -C /tmp/baseline
          #   cd /tmp/baseline && pip install -e ".[freeze]" \
          #     && pyinstaller freeze/kenaz-ml.spec --noconfirm --clean
          #   (that commit predates uv; today the equivalent is `make freeze`)
          #   du -sm dist/kameas-ml
          #
          # 126 MB / 210 native libraries. Update this only alongside a recorded
          # re-measurement; silently raising it to make a red build green is
          # exactly the drift the gate exists to catch.
          BASELINE_BUNDLE_MB: '126'
          # NFR-001: no more than 350 MB over the pre-migration set.
          GROWTH_CEILING_MB: '350'
          TARGET: ${{ matrix.target }}
        run: |
          BUNDLE_MB=$(du -sm dist/kameas-ml | cut -f1)
          LIBS=$(find dist/kameas-ml \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.pyd' \) | wc -l | tr -d ' ')
          DELTA_MB=$((BUNDLE_MB - BASELINE_BUNDLE_MB))
          HEADROOM_MB=$((GROWTH_CEILING_MB - DELTA_MB))

          {
            echo "### Frozen bundle size (${TARGET})"
            echo ""
            echo "| | value |"
            echo "|---|---|"
            echo "| bundle | ${BUNDLE_MB} MB |"
            echo "| pre-migration baseline (macOS arm64) | ${BASELINE_BUNDLE_MB} MB |"
            echo "| **delta** | **+${DELTA_MB} MB** |"
            echo "| NFR-001 ceiling | ${GROWTH_CEILING_MB} MB |"
            echo "| headroom | ${HEADROOM_MB} MB |"
            echo "| native libraries | ${LIBS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "bundle ${BUNDLE_MB} MB; baseline ${BASELINE_BUNDLE_MB} MB; delta +${DELTA_MB} MB; ceiling ${GROWTH_CEILING_MB} MB; ${LIBS} native libraries"

          if [ "$TARGET" = "darwin-arm64" ] && [ "$DELTA_MB" -gt "$GROWTH_CEILING_MB" ]; then
            echo "::error::bundle grew +${DELTA_MB} MB over the pre-migration baseline, past NFR-001's ${GROWTH_CEILING_MB} MB ceiling"
            exit 1
          fi

      # ---- Windows code signing (same Azure Trusted Signing setup as the harness) ----
      # The org's AZURE_* secrets sign kameas-ml.exe through Azure's HSM. Like
      # the harness release, these steps are continue-on-error: an unsigned
      # Windows engine is preferable to no Windows engine, and the notices
      # below say which happened. Nothing here touches the other targets.
      - name: Azure login (OIDC) — Windows signing
        id: azure_login
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        continue-on-error: true
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign kameas-ml.exe (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != '' && steps.azure_login.outcome == 'success'
        continue-on-error: true
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist/kameas-ml
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Windows signing skipped notice
        if: runner.os == 'Windows' && (env.AZURE_CLIENT_ID == '' || steps.azure_login.outcome != 'success')
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::notice::Windows engine not signed — the org's AZURE_* secrets are not visible to this repository (add kenaz-ml to their repository list)."
          else
            echo "::warning::Windows engine not signed — Azure OIDC login failed (check the federated credential's subject covers this repo's refs)."
          fi

      - name: Freeze smoke tests — real feature call, read-only bundle, cold start
        # The gate that means something. Covers, on the actual artifact:
        #   * /predict/stuck through the frozen sklearn estimator path
        #   * the shipped registry, its producing-Feast-version marker (D-007)
        #   * a real Feast feature resolution with the application directory
        #     chmod'd unwritable, asserting nothing inside the bundle changed and
        #     that the online store landed in the user data directory (FR-013)
        #   * cold start against NFR-003's 10 s budget, on the real binary
        env:
          KENAZ_ML_FROZEN_BIN: ${{ github.workspace }}/dist/kameas-ml/${{ matrix.exe }}
          KENAZ_ML_COLD_START_BUDGET_SEC: ${{ matrix.cold_start_budget_sec || '10' }}
        run: uv run pytest tests/test_frozen_smoke.py -v -s

      - name: Package the bundle
        # Linux and Windows ship as a zip whose root is the `kameas-ml/`
        # onedir (the same layout as the macOS .dmg volume), written by one
        # script on every runner: forward-slash entry names and Unix mode
        # bits, so the harness's Go unzipper and plain `unzip` both get a
        # runnable tree (Compress-Archive writes backslash names). macOS is
        # packaged by the notarize job from the raw onedir artifact below.
        if: ${{ !startsWith(matrix.target, 'darwin') }}
        env:
          NAME: kenaz-ml-${{ steps.ver.outputs.version }}-${{ matrix.target }}
        run: |
          set -euo pipefail
          uv run python scripts/package_bundle.py --onedir dist/kameas-ml --out "release/${NAME}.zip"
          uv run python - <<'PY'
          import zipfile, sys, glob
          z = zipfile.ZipFile(glob.glob("release/*.zip")[0])
          names = z.namelist()
          bad = [n for n in names if "\\" in n or not n.startswith("kameas-ml/")]
          assert not bad, bad[:5]
          assert any(n in ("kameas-ml/kameas-ml", "kameas-ml/kameas-ml.exe") for n in names)
          print(f"{len(names)} entries, root kameas-ml/, forward slashes")
          PY
          ls -l release

      - name: Upload frozen bundle (macOS onedir, for the notarize job)
        if: startsWith(matrix.target, 'darwin')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mac_artifact }}
          path: dist/kameas-ml
          retention-days: 7

      - name: Upload packaged bundle
        if: ${{ !startsWith(matrix.target, 'darwin') }}
        uses: actions/upload-artifact@v4
        with:
          name: kenaz-ml-${{ matrix.target }}
          path: release/*.zip
          retention-days: 7

  # ==========================================================================
  # Notarization gate (WP05 T022; FR-012, NFR-005)
  # ==========================================================================
  # Feast takes the bundle from 210 to 435 Mach-O files, every one of which must
  # be signed with a hardened runtime and covered by a successful notarization
  # ticket. This job signs the bundle inside-out, notarizes it, staples the
  # ticket, and then VERIFIES rather than trusting the submission result:
  # `codesign --verify --deep --strict` and `xcrun stapler validate`.
  #
  # It requires Apple Developer credentials, which are repository secrets. When
  # they are absent the job reports plainly that the gate did not run instead of
  # passing vacuously — a green check that verified nothing is worse than a
  # missing one, and NFR-005 asks for a gate that is trustworthy, not one that
  # is merely green.
  #
  # Stapling targets a disk image rather than the bare onedir tree because
  # `stapler` can only attach a ticket to a container format (.app, .dmg, .pkg);
  # there is nowhere on a loose executable to put one. The .dmg is therefore the
  # distributable artifact, and it is what gets validated.
  #
  # Release semantics (two-client-engine-01MSK2EN WP08, Amendment A3.1): the
  # engine artifact IS this job's signed + notarized + stapled .dmg — a zip or
  # a bare onedir cannot carry a stapled ticket. On a RELEASE build (a `v*` tag)
  # missing Apple credentials is a hard FAILURE, never a "NOT RUN" skip. On a
  # non-release run (a push to main, a manual dispatch off a branch) the skip is
  # still allowed, is reported as NOT RUN, and can never satisfy the release
  # gate, because the release gate is this job on the tag's run. The freeze spec
  # is not involved: it keeps codesign_identity=None; CI signs, the freeze does
  # not.
  notarize:
    name: Notarization gate (${{ matrix.target }})
    needs: freeze
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            artifact: kenaz-ml-macos-arm64
          - os: macos-15-intel
            target: darwin-x86_64
            artifact: kenaz-ml-macos-x86_64
    env:
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
      PLANT_VIOLATION: ${{ github.event.inputs.plant_violation || 'none' }}
      # The Developer ID identity the kameas-ai org signs every macOS artifact
      # with (same constant the harness and kenaz releases use). The
      # certificate itself comes from the org's APPLE_CERT_P12 secret.
      APPLE_SIGN_IDENTITY: "Developer ID Application: Kameas AI, Inc. (K54JDRHBA7)"
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/kameas-ml

      - name: Restore executable bits
        # actions/upload-artifact does not preserve the executable bit.
        run: |
          chmod +x dist/kameas-ml/kameas-ml
          find dist/kameas-ml -name '*.dylib' -o -name '*.so' | xargs -I{} chmod +x {}

      - name: Check for signing credentials
        id: creds
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_CERT_P12" ] && [ -n "$APPLE_CERT_P12_PASSWORD" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release builds require credentials (A3.1 — fail, never skip)
        if: steps.creds.outputs.configured != 'true' && env.RELEASE_BUILD == 'true'
        run: |
          {
            echo "### Notarization gate: FAILED — release build without Apple credentials"
            echo ""
            echo "\`${GITHUB_REF}\` is a release build. The engine artifact is the signed +"
            echo "notarized + stapled .dmg this job produces, so it cannot be skipped here."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::release build ${GITHUB_REF} has no Apple Developer credentials; the notarized engine .dmg cannot be produced (FR-021, Amendment A3.1)"
          exit 1

      - name: Report that the gate did not run
        if: steps.creds.outputs.configured != 'true'
        run: |
          {
            echo "### Notarization gate: NOT RUN (non-release run — does NOT satisfy the release gate)"
            echo ""
            echo "Apple Developer credentials are not configured for this repository, so the"
            echo "bundle was neither signed, notarized, nor stapled. FR-012 and NFR-005 are"
            echo "**unverified** for this build."
            echo ""
            echo "These are kameas-ai ORGANIZATION secrets (shared with the harness and kenaz releases);"
            echo "add this repository to their repository list in the org settings:"
            echo ""
            echo "| org secret | purpose |"
            echo "|---|---|"
            echo "| \`APPLE_CERT_P12\` / \`APPLE_CERT_P12_PASSWORD\` | base64 Developer ID Application .p12 and its password |"
            echo "| \`APPLE_API_KEY_P8\` / \`APPLE_API_KEY_ID\` / \`APPLE_API_ISSUER_ID\` | App Store Connect API key for \`notarytool\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::notarization gate skipped — Apple Developer credentials are not configured; FR-012/NFR-005 are unverified for this build"

      - name: Import signing certificate
        if: steps.creds.outputs.configured == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$APPLE_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm -f /tmp/certificate.p12

      - name: Sign the bundle inside-out
        if: steps.creds.outputs.configured == 'true'
        env:
          IDENTITY: ${{ env.APPLE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # Inside-out: every nested Mach-O first, the launcher last. Signing the
          # launcher before its dylibs invalidates the outer signature the moment
          # an inner one is written (ADR-nested-binary-signing).
          find dist/kameas-ml -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -n 25 codesign --force --timestamp --options runtime --sign "$IDENTITY"
          codesign --force --timestamp --options runtime --sign "$IDENTITY" dist/kameas-ml/kameas-ml
          echo "signed $(find dist/kameas-ml \( -name '*.so' -o -name '*.dylib' \) | wc -l | tr -d ' ') nested Mach-O files plus the launcher"

      - name: "Planted violation: strip one nested signature (evidence run only)"
        if: steps.creds.outputs.configured == 'true' && env.PLANT_VIOLATION == 'unsigned_dylib'
        run: |
          set -euo pipefail
          # -print -quit, not `| head -1`: under pipefail, head closing the pipe
          # early SIGPIPEs find and fails this step for the wrong reason.
          victim=$(find dist/kameas-ml -type f -name '*.dylib' -print -quit)
          [ -n "$victim" ] || { echo "::error::no dylib found to plant the violation on"; exit 1; }
          codesign --remove-signature "$victim"
          echo "::warning::PLANTED VIOLATION — removed the signature from $victim; the next step must fail"

      - name: Verify every nested signature before notarizing
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Fail here rather than at Apple's end: a single unsigned nested binary
          # is the documented way this fails with 435 of them, and the local
          # error names the file while the notarization log does not always.
          failed=0
          while IFS= read -r macho; do
            if ! codesign --verify --strict "$macho" 2>/dev/null; then
              echo "::error::unsigned or invalid signature: $macho"
              failed=1
            fi
          done < <(find dist/kameas-ml -type f \( -name '*.dylib' -o -name '*.so' \))
          codesign --verify --deep --strict --verbose=2 dist/kameas-ml/kameas-ml
          [ "$failed" -eq 0 ]

      - name: Notarize and staple
        if: steps.creds.outputs.configured == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          AC_API_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ac
          echo "$AC_API_PRIVATE_KEY" > "/tmp/ac/AuthKey_${AC_API_KEY_ID}.p8"

          # A .dmg, because a ticket has to be stapled to a container.
          #
          # Layout contract (engine-publication-01ENPUB01 WP-M1): the harness
          # installer (kenaz-harness core/mlsidecar/dmg.go, EngineOnedirName)
          # requires a `kameas-ml/` DIRECTORY at the volume root and copies
          # that tree. `hdiutil -srcfolder` places the folder's CONTENTS at
          # the root, so the onedir is staged one level down first; passing
          # dist/kameas-ml directly produced a volume the installer refused.
          rm -rf /tmp/dmg-root && mkdir -p /tmp/dmg-root
          cp -R dist/kameas-ml /tmp/dmg-root/kameas-ml
          hdiutil create -volname kenaz-ml -srcfolder /tmp/dmg-root \
            -ov -format UDZO /tmp/kenaz-ml.dmg
          rm -rf /tmp/dmg-root

          # Prove the layout before spending a notarization round on it.
          MOUNT=$(hdiutil attach /tmp/kenaz-ml.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')
          if [ ! -d "$MOUNT/kameas-ml" ] || [ ! -x "$MOUNT/kameas-ml/kameas-ml" ] || [ ! -d "$MOUNT/kameas-ml/_internal" ]; then
            ls -la "$MOUNT"; hdiutil detach "$MOUNT" || true
            echo "::error::dmg layout is wrong: expected <root>/kameas-ml/{kameas-ml,_internal}; the harness installer would refuse this image"
            exit 1
          fi
          hdiutil detach "$MOUNT"

          xcrun notarytool submit /tmp/kenaz-ml.dmg \
            --key "/tmp/ac/AuthKey_${AC_API_KEY_ID}.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 45m
          xcrun stapler staple /tmp/kenaz-ml.dmg
          rm -rf /tmp/ac

      - name: Verify notarization (FR-012, NFR-005)
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # The submission result is not the gate; these three are. `--deep
          # --strict` walks the nested Mach-O files rather than trusting the
          # outer signature, `stapler validate` proves the ticket is attached
          # (so a machine offline at first launch still passes), and `spctl`
          # is the assessment Gatekeeper itself performs.
          codesign --verify --deep --strict --verbose=2 dist/kameas-ml/kameas-ml
          xcrun stapler validate /tmp/kenaz-ml.dmg
          spctl --assess --type open --context context:primary-signature -vv /tmp/kenaz-ml.dmg
          echo "### Notarization gate: PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv
        if: steps.creds.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify the notarized artifact serves a real feature call
        if: steps.creds.outputs.configured == 'true'
        # US4 acceptance scenario 3: it is not enough that the notarized artifact
        # verifies — it has to work when mounted from the distributable image,
        # with the application directory read-only, which is what a user gets.
        # The mounted volume is read-only by construction, so this is the
        # closest thing CI has to a clean-machine install.
        run: |
          set -euo pipefail
          uv sync --locked
          export PATH="$PWD/.venv/bin:$PATH"
          MOUNT=$(hdiutil attach /tmp/kenaz-ml.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')
          # `serves_health` (added by WP08) reuses test_frozen_binary_serves_health
          # and its launcher against the MOUNTED, notarized binary.
          KENAZ_ML_FROZEN_BIN="$MOUNT/kameas-ml/kameas-ml" pytest tests/test_frozen_smoke.py -v -s \
            -k "feature_store or registry_records or serves_health" || {
              hdiutil detach "$MOUNT" || true
              exit 1
            }
          hdiutil detach "$MOUNT"

      - name: Spawn the notarized artifact and verify /health identity + the lease lifecycle (FR-021)
        if: steps.creds.outputs.configured == 'true'
        # Repair R3's spawn-smoke half, on the artifact users actually receive:
        # the stapled .dmg, mounted read-only. Spawns the staged binary with a
        # temporary install root (never the runner's real directories) and a 1 s
        # lease sweep (the 600 s idle window keeps the timer from racing the
        # smoke), asserts the WP05 identity payload, then proves the
        # token-authorized shutdown really stops it. `spctl --assess` on the same
        # .dmg ran in "Verify notarization" above.
        run: |
          set -euo pipefail
          MOUNT=$(hdiutil attach /tmp/kenaz-ml.dmg -nobrowse -readonly | tail -1 | awk '{print $NF}')
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          ROOT=$(mktemp -d)
          DATA=$(mktemp -d)
          mkdir -p "$ROOT/lease"
          TOKEN=$(uuidgen)
          printf '%s\n' "$TOKEN" > "$ROOT/lease/shutdown.token"
          chmod 600 "$ROOT/lease/shutdown.token"
          PORT=7797
          KENAZ_ML_INSTALL_ROOT="$ROOT" XDG_DATA_HOME="$DATA" \
            KENAZ_ML_IDLE_EXIT_SEC=600 KENAZ_ML_LEASE_SWEEP_SEC=1 \
            "$MOUNT/kameas-ml/kameas-ml" serve --host 127.0.0.1 --port "$PORT" > /tmp/spawn.log 2>&1 &
          PID=$!
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /tmp/health.json "http://127.0.0.1:$PORT/health"; then ready=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/spawn.log; echo "::error::the notarized binary exited before answering /health"; exit 1; fi
            sleep 1
          done
          [ -n "$ready" ] || { cat /tmp/spawn.log; echo "::error::the notarized binary never answered /health"; exit 1; }
          if [ "$PLANT_VIOLATION" = "broken_health" ]; then
            echo "::warning::PLANTED VIOLATION — corrupting the /health payload; this step must fail"
            echo '{}' > /tmp/health.json
          fi
          MOUNT="$MOUNT" python3 - <<'PY'
          import json, os
          body = json.load(open("/tmp/health.json"))
          required = ["product", "sidecar_version", "contract_versions", "exe_path", "engine_sha256",
                      "model_details", "device", "lifecycle_protocol"]
          missing = [k for k in required if k not in body]
          assert not missing, f"/health identity fields missing: {missing}"
          assert body["product"] == "kenaz-ml", body["product"]
          assert body["lifecycle_protocol"] == 1, body["lifecycle_protocol"]
          assert body["sidecar_version"], "empty sidecar_version"
          assert body["engine_sha256"] and len(body["engine_sha256"]) == 64, body["engine_sha256"]
          # A5: the version is real, stamped from pyproject.toml, carried in the
          # onedir-root VERSION file, and (on a tag) is the tag's version.
          version = body["sidecar_version"]
          assert version and version != "0+unknown", version
          root_file = open(os.path.join(os.environ["MOUNT"], "kameas-ml", "VERSION")).read().strip()
          assert root_file == version, (root_file, version)
          if os.environ.get("RELEASE_BUILD") == "true":
              assert version != "0.1.0", "release build still reports the placeholder 0.1.0"
              assert version == os.environ["GITHUB_REF_NAME"].removeprefix("v"), (version, os.environ["GITHUB_REF_NAME"])
          mount = os.path.realpath(os.environ["MOUNT"])
          assert os.path.realpath(body["exe_path"]).startswith(mount), (body["exe_path"], mount)
          print("identity OK:", {k: body[k] for k in ("product", "sidecar_version", "lifecycle_protocol", "exe_path")})
          PY
          # `--version` on the notarized launcher agrees with /health (A5).
          CLI_VERSION=$("$MOUNT/kameas-ml/kameas-ml" --version)
          HEALTH_VERSION=$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['sidecar_version'])")
          [ "$CLI_VERSION" = "$HEALTH_VERSION" ] || { echo "::error::--version ($CLI_VERSION) != /health ($HEALTH_VERSION)"; exit 1; }
          # A wrong token must be refused and leave the engine running...
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer wrong" "http://127.0.0.1:$PORT/v1/admin/shutdown")
          [ "$code" = "403" ] || { echo "::error::wrong shutdown token answered $code, expected 403"; exit 1; }
          kill -0 "$PID" || { echo "::error::a refused shutdown stopped the engine"; exit 1; }
          # ...and the right one must stop it gracefully.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/v1/admin/shutdown")
          [ "$code" = "202" ] || { echo "::error::authorized shutdown answered $code, expected 202"; exit 1; }
          for _ in $(seq 1 30); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$PID" 2>/dev/null; then kill "$PID"; echo "::error::the engine did not exit after an authorized shutdown"; exit 1; fi
          echo "### Spawn-smoke on the notarized .dmg: PASSED" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload notarized disk image
        if: steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-notarized
          path: /tmp/kenaz-ml.dmg
          retention-days: 14

  # ==========================================================================
  # GitHub Release assets — the pip-free distribution surface
  # ==========================================================================
  # On a `v*` tag, every platform bundle is attached to the GitHub Release
  # under its canonical name, with a SHA256SUMS file the install scripts
  # verify against (scripts/assemble_release_assets.sh lists them). The
  # release is created here if release.yml has not created it yet; uploads use
  # --clobber so a re-run replaces rather than fails. Needs nothing beyond
  # GitHub; the S3/CDN publish job below is the harness's pinned channel.
  release-assets:
    name: GitHub Release assets
    needs: [freeze, notarize]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download notarized macOS images
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: kenaz-ml-macos-*-notarized

      - name: Download Linux and Windows bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: kenaz-ml-{linux,windows}-*

      - name: Assemble release assets
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/assemble_release_assets.sh "${TAG#v}" bundles assets

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" assets/* --clobber
          {
            echo "### Release assets: PASSED"
            echo ""
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
            echo ""
            echo "Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Publication to the release bucket + CDN (engine-publication-01ENPUB01)
  # ==========================================================================
  # The same environment resolution and AWS access pattern as the harness and
  # kenaz releases, so one set of repo variables and one IAM setup serve all
  # three products:
  #
  #   trigger                         env    bucket                          CDN
  #   push to main                    dev    kameas-ai-dev-releases-use2     dev.downloads.kameas.ai
  #   tag v*-rc*                      stage  kameas-ai-stage-releases-use2   stage.downloads.kameas.ai
  #   tag v* (no -rc) / dispatch      prod   kameas-ai-prod-releases-use2    downloads.kameas.ai
  #
  # Access is two hops, as in the harness: GitHub OIDC assumes the per-env
  # gh-deploy role (DEPLOY_ROLE_ARN_<ENV>), which assumes the env account's
  # AppDeployRole (APPDEPLOY_ROLE_ARN_<ENV>). Both ARNs are repo Actions
  # variables — the same six the harness repo carries — so no account ids are
  # committed here. The IAM trust policies must admit this repository.
  #
  # What lands, per platform, under s3://<bucket>/kenaz-ml/<label>/ :
  #   kenaz-ml-<label>-<target>.{dmg,zip}   immutable (If-None-Match), sha256 in metadata
  #   kenaz-ml-<label>-<target>.{dmg,zip}.sig   raw ed25519 over the engine MANIFEST
  #                                             (version, bare filename, sha256) — the
  #                                             harness's verified-install contract;
  #                                             written only when the signing key exists
  #   SHA256SUMS
  # plus kenaz-ml/index.json (informational, newest first, one entry per label
  # with a key per platform) and a CloudFront invalidation of it.
  #
  # <label> is the bare version for tags (1.2.3; the harness pin derives the
  # file names from it and rejects a leading v) and <version>-dev.<sha7> for
  # main pushes, so dev builds never collide with each other or a release.
  resolve-env:
    name: Resolve release environment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      target_env: ${{ steps.pick.outputs.target_env }}
      bucket: ${{ steps.pick.outputs.bucket }}
      role_arn: ${{ steps.pick.outputs.role_arn }}
      appdeploy_role_arn: ${{ steps.pick.outputs.appdeploy_role_arn }}
      cf_dist_id: ${{ steps.pick.outputs.cf_dist_id }}
      cdn_base: ${{ steps.pick.outputs.cdn_base }}
      label: ${{ steps.pick.outputs.label }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        env:
          DEPLOY_ROLE_ARN_DEV: ${{ vars.DEPLOY_ROLE_ARN_DEV }}
          DEPLOY_ROLE_ARN_STAGE: ${{ vars.DEPLOY_ROLE_ARN_STAGE }}
          DEPLOY_ROLE_ARN_PROD: ${{ vars.DEPLOY_ROLE_ARN_PROD }}
          APPDEPLOY_ROLE_ARN_DEV: ${{ vars.APPDEPLOY_ROLE_ARN_DEV }}
          APPDEPLOY_ROLE_ARN_STAGE: ${{ vars.APPDEPLOY_ROLE_ARN_STAGE }}
          APPDEPLOY_ROLE_ARN_PROD: ${{ vars.APPDEPLOY_ROLE_ARN_PROD }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            TARGET="prod"
          elif [[ "$REF" == refs/tags/v*-rc* ]]; then
            TARGET="stage"
          elif [[ "$REF" == refs/tags/v* ]]; then
            TARGET="prod"
          else
            TARGET="dev"
          fi
          case "$TARGET" in
            dev)   BUCKET="kameas-ai-dev-releases-use2";   ROLE_ARN="$DEPLOY_ROLE_ARN_DEV";   APPDEPLOY_ROLE_ARN="$APPDEPLOY_ROLE_ARN_DEV";   CF_DIST_ID="E1PRT6QD4VW589"; CDN_BASE="https://dev.downloads.kameas.ai" ;;
            stage) BUCKET="kameas-ai-stage-releases-use2"; ROLE_ARN="$DEPLOY_ROLE_ARN_STAGE"; APPDEPLOY_ROLE_ARN="$APPDEPLOY_ROLE_ARN_STAGE"; CF_DIST_ID="E1N8AI5X4GRPWU"; CDN_BASE="https://stage.downloads.kameas.ai" ;;
            prod)  BUCKET="kameas-ai-prod-releases-use2";  ROLE_ARN="$DEPLOY_ROLE_ARN_PROD";  APPDEPLOY_ROLE_ARN="$APPDEPLOY_ROLE_ARN_PROD";  CF_DIST_ID="ENWB9Y4KGTPFD";  CDN_BASE="https://downloads.kameas.ai" ;;
          esac
          VERSION=$(python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'src'); from kenaz_ml._version import pyproject_version; print(pyproject_version(Path('pyproject.toml')) or '')")
          [ -n "$VERSION" ] || { echo "::error::could not read the engine version from pyproject.toml"; exit 1; }
          if [[ "$REF" == refs/tags/v* ]]; then
            LABEL="${REF#refs/tags/v}"
          else
            LABEL="${VERSION}-dev.${SHA:0:7}"
          fi
          {
            echo "target_env=$TARGET"
            echo "bucket=$BUCKET"
            echo "role_arn=$ROLE_ARN"
            echo "appdeploy_role_arn=$APPDEPLOY_ROLE_ARN"
            echo "cf_dist_id=$CF_DIST_ID"
            echo "cdn_base=$CDN_BASE"
            echo "label=$LABEL"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: event=$EVENT ref=$REF -> env=$TARGET bucket=$BUCKET label=$LABEL"

  publish:
    name: Publish engine release (${{ needs.resolve-env.outputs.target_env }})
    needs: [resolve-env, freeze, notarize]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # The GitHub environment named after the target env carries the release
    # signing key (an environment secret) and gives the OIDC token the
    # `environment:` subject the IAM trust policies match on; required
    # reviewers on prod gate the key. One publish at a time per env: index.json
    # is a read-modify-write.
    environment: ${{ needs.resolve-env.outputs.target_env }}
    concurrency:
      group: kenaz-ml-publish-${{ needs.resolve-env.outputs.target_env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # The kenaz-harness commit the engine-manifest signer (cmd/kenaz-ml-sign)
      # is taken from. A full SHA, bumped deliberately: the bytes we sign with
      # must be the bytes that were reviewed there.
      HARNESS_SIGNER_REF: 3c05def820a7dc9b402a186e66823c30140c6c79
      AWS_REGION: us-east-2
      LABEL: ${{ needs.resolve-env.outputs.label }}
      BUCKET: ${{ needs.resolve-env.outputs.bucket }}
      CDN_BASE: ${{ needs.resolve-env.outputs.cdn_base }}
      TARGET_ENV: ${{ needs.resolve-env.outputs.target_env }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check publication prerequisites
        id: prereqs
        env:
          ROLE_ARN: ${{ needs.resolve-env.outputs.role_arn }}
          APPDEPLOY_ROLE_ARN: ${{ needs.resolve-env.outputs.appdeploy_role_arn }}
          SIGNING_KEY: ${{ secrets.KENAZ_ML_RELEASE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.KENAZ_ML_RELEASE_PUBLIC_KEY }}
        run: |
          missing=()
          [ -n "$ROLE_ARN" ]          || missing+=("var DEPLOY_ROLE_ARN_${TARGET_ENV^^}")
          [ -n "$APPDEPLOY_ROLE_ARN" ] || missing+=("var APPDEPLOY_ROLE_ARN_${TARGET_ENV^^}")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Publish (${TARGET_ENV}): NOT RUN — ${LABEL} was built but NOT published to the ${TARGET_ENV} bucket"
              echo ""
              echo "Missing (set the same repo Actions variables the harness release uses):"
              echo ""
              for m in "${missing[@]}"; do echo "- $m"; done
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::engine ${LABEL} NOT published to ${TARGET_ENV} — missing: ${missing[*]}"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$SIGNING_KEY" ] && [ -n "$PUBLIC_KEY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no release signing key for ${TARGET_ENV} (environment secret KENAZ_ML_RELEASE_SIGNING_KEY + var KENAZ_ML_RELEASE_PUBLIC_KEY); bundles publish WITHOUT .sig files — install scripts work, the harness's verified pin cannot use this label"
          fi

      - name: Download notarized macOS images
        if: steps.prereqs.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles
          pattern: kenaz-ml-macos-*-notarized

      - name: Download Linux and Windows bundles
        if: steps.prereqs.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: bundles
          pattern: kenaz-ml-{linux,windows}-*

      - name: Assemble release assets
        if: steps.prereqs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # The freeze named the bundles after pyproject's version. For a tag
          # the label is that version; for a dev build it is <version>-dev.<sha7>,
          # so every bundle is renamed to the label being published.
          PYVER=$(python3 -c "from pathlib import Path; import sys; sys.path.insert(0, 'src'); from kenaz_ml._version import pyproject_version; print(pyproject_version(Path('pyproject.toml')))")
          scripts/assemble_release_assets.sh "$PYVER" bundles staged
          mkdir -p release
          for f in staged/kenaz-ml-"${PYVER}"-*; do
            suffix="${f##*/kenaz-ml-${PYVER}-}"             # "<target>.<ext>"
            mv "$f" "release/kenaz-ml-${LABEL}-${suffix}"
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release

      - name: Check out the harness signer at its pinned ref
        if: steps.prereqs.outputs.sign == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kameas-ai/kenaz-harness
          ref: ${{ env.HARNESS_SIGNER_REF }}
          path: .siblings/kenaz-harness

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.prereqs.outputs.sign == 'true'
        with:
          go-version-file: .siblings/kenaz-harness/go.mod
          cache-dependency-path: .siblings/kenaz-harness/go.sum

      - name: Build the signer (no key in the environment)
        if: steps.prereqs.outputs.sign == 'true'
        working-directory: .siblings/kenaz-harness
        run: go build -o "$RUNNER_TEMP/kenaz-ml-sign" ./cmd/kenaz-ml-sign

      - name: Sign every bundle's manifest and self-check
        if: steps.prereqs.outputs.sign == 'true'
        id: sign
        env:
          KENAZ_ML_RELEASE_SIGNING_KEY: ${{ secrets.KENAZ_ML_RELEASE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.KENAZ_ML_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          SIGNER="$RUNNER_TEMP/kenaz-ml-sign"
          printf '%s' "$PUBLIC_KEY" > "$RUNNER_TEMP/release.pub"
          key_id=""
          for f in release/kenaz-ml-*.dmg release/kenaz-ml-*.zip; do
            name=$(basename "$f")
            sha="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            # What is signed is the engine MANIFEST (version, channel-relative
            # artifact path = bare filename, sha256), not the bytes; the bytes
            # are bound through the sha256. Same inputs the harness pin rebuilds.
            "$SIGNER" sign --version "$LABEL" --artifact-path "$name" --sha256 "$sha" --out "$f.sig" > "$f.sign.json"
            [ "$(stat -c %s "$f.sig")" -eq 64 ] || { echo "::error::$name.sig is not a raw 64-byte ed25519 signature"; exit 1; }
            "$SIGNER" verify --pubkey "$RUNNER_TEMP/release.pub" --sig "$f.sig" --version "$LABEL" --artifact-path "$name" --sha256 "$sha"
            key_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["key_id"])' "$f.sign.json")
            rm -f "$f.sign.json"
          done
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC → gh-deploy role)
        if: steps.prereqs.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ needs.resolve-env.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume the env account's AppDeployRole
        if: steps.prereqs.outputs.ready == 'true'
        env:
          APPDEPLOY_ROLE_ARN: ${{ needs.resolve-env.outputs.appdeploy_role_arn }}
        run: |
          set -euo pipefail
          CREDS=$(aws sts assume-role --role-arn "$APPDEPLOY_ROLE_ARN" --role-session-name gh-publish-kenaz-ml --query Credentials --output json)
          for k in AccessKeyId SecretAccessKey SessionToken; do echo "::add-mask::$(echo "$CREDS" | jq -r ".$k")"; done
          {
            echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)"
            echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)"
          } >> "$GITHUB_ENV"

      - name: Upload bundles, signatures and checksums (immutable, idempotent)
        if: steps.prereqs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          PREFIX="kenaz-ml/${LABEL}"
          # Release objects are immutable, and a re-run after a partial publish
          # must be able to finish:
          #   head-object 404            -> upload with If-None-Match: * (no check-then-put window)
          #   head-object 200, same sha  -> already published; continue
          #   head-object 200, other sha -> fail: a different artifact holds this name
          #   any other head-object error -> fail: never treat 403/throttling/network as "absent"
          publish_object() {
            local file="$1" key="$2" content_type="$3" cache="$4"
            local sha b64 remote
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            b64=$(openssl dgst -sha256 -binary "$file" | base64 -w0)
            if aws s3api head-object --bucket "$BUCKET" --key "$key" > "$RUNNER_TEMP/head.json" 2> "$RUNNER_TEMP/head.err"; then
              remote=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("Metadata", {}).get("sha256", ""))' "$RUNNER_TEMP/head.json")
              if [ "$remote" = "$sha" ]; then echo "s3://${BUCKET}/${key} already published; continuing"; return 0; fi
              echo "::error::s3://${BUCKET}/${key} already exists with a different sha256 (${remote:-unrecorded}); release objects are immutable"
              return 1
            fi
            if ! grep -q "(404)" "$RUNNER_TEMP/head.err"; then
              echo "::error::could not determine whether s3://${BUCKET}/${key} exists:"; cat "$RUNNER_TEMP/head.err"; return 1
            fi
            aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$file" --if-none-match '*' \
              --checksum-sha256 "$b64" --metadata "sha256=${sha}" --content-type "$content_type" --cache-control "$cache" > /dev/null
            echo "uploaded s3://${BUCKET}/${key} (sha256:${sha})"
          }
          for f in release/*; do
            name=$(basename "$f")
            case "$name" in
              *.dmg) ct=application/x-apple-diskimage ;;
              *.zip) ct=application/zip ;;
              *.sig) ct=application/octet-stream ;;
              SHA256SUMS) ct=text/plain ;;
              *) ct=application/octet-stream ;;
            esac
            publish_object "$f" "${PREFIX}/${name}" "$ct" "public, max-age=31536000, immutable"
          done

      - name: Update index.json and invalidate it on the CDN
        if: steps.prereqs.outputs.ready == 'true'
        env:
          DISTRIBUTION: ${{ needs.resolve-env.outputs.cf_dist_id }}
          KEY_ID: ${{ steps.sign.outputs.key_id }}
        run: |
          set -euo pipefail
          # Informational only; the harness pin never reads it. Newest first = publish order.
          # Start from empty ONLY on a confirmed NoSuchKey; any other read failure fails the job.
          if ! aws s3api get-object --bucket "$BUCKET" --key kenaz-ml/index.json index.json > /dev/null 2> "$RUNNER_TEMP/index.err"; then
            if grep -q "NoSuchKey" "$RUNNER_TEMP/index.err"; then echo '{"name":"kenaz-ml","releases":[]}' > index.json
            else echo "::error::could not read the existing kenaz-ml/index.json; refusing to overwrite it:"; cat "$RUNNER_TEMP/index.err"; exit 1; fi
          fi
          python3 - <<'PY'
          import json, os, hashlib
          from datetime import datetime, timezone
          label, base = os.environ["LABEL"], f"{os.environ['CDN_BASE']}/kenaz-ml/{os.environ['LABEL']}"
          platforms = {}
          for name in sorted(os.listdir("release")):
              if not name.startswith("kenaz-ml-") or name.endswith(".sig") or name == "SHA256SUMS":
                  continue
              target = name[len(f"kenaz-ml-{label}-"):].rsplit(".", 1)[0].replace("-", "_")
              path = os.path.join("release", name)
              entry = {"url": f"{base}/{name}", "sha256": "sha256:" + hashlib.sha256(open(path, "rb").read()).hexdigest(), "size_bytes": os.path.getsize(path)}
              if os.path.exists(path + ".sig"):
                  entry["sig_url"], entry["key_id"] = f"{base}/{name}.sig", os.environ.get("KEY_ID", "")
              platforms[target] = entry
          index = json.load(open("index.json"))
          releases = [r for r in index.get("releases", []) if r.get("version") != label]
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          index = {"name": "kenaz-ml", "releases": [{"version": label, "env": os.environ["TARGET_ENV"], "released_at": now, **platforms}, *releases][:100]}
          json.dump(index, open("index.json", "w"), indent=2)
          print(json.dumps(index["releases"][0], indent=2))
          PY
          aws s3api put-object --bucket "$BUCKET" --key kenaz-ml/index.json --body index.json --content-type application/json --cache-control "public, max-age=300" > /dev/null
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/kenaz-ml/index.json" > /dev/null
          {
            echo "### Publish (${TARGET_ENV}): PASSED — ${CDN_BASE}/kenaz-ml/${LABEL}/"
            echo ""
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
