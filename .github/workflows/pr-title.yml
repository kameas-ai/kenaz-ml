name: PR Title
# kameas-ci: check

# The squash-merge commit subject is the PR title (repo setting PR_TITLE),
# and tag-on-merge.yml reads that subject to decide whether a merge cuts a
# release and how far to bump. This check keeps every title a conventional
# commit so that decision is never ambiguous. Same configuration as the
# harness's pr-title.yml.

# Manual only (owner decision 2026-10-30). Dispatch on the PR's branch
# (`gh workflow run pr-title.yml --ref <branch>`); the check looks up the open
# PR for that branch and validates its title. The job name
# `Conventional Commits` is a REQUIRED status check — do not rename it.
# (amannn/action-semantic-pull-request only works on pull_request events, so
# the check is inline.)
on:
  workflow_dispatch:

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a Conventional Commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json title -q '.[0].title')
          [ -n "$title" ] || { echo "::error::no open PR for $GITHUB_REF_NAME"; exit 1; }
          echo "PR title: $title"
          # Same type list and subject rule as the harness's pr-title.yml:
          # optional lowercase scope; subject non-empty, not starting with
          # whitespace/a period, not ending with a period/space.
          re='^(feat|fix|perf|revert|deps|docs|style|chore|refactor|test|build|ci)(\([a-z0-9][a-z0-9._/,-]*\))?!?: [^[:space:].](.*[^. ])?$'
          [[ "$title" =~ $re ]] || { echo "::error::PR title is not a Conventional Commit: $title"; exit 1; }
          echo "OK"
