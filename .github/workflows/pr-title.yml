name: PR Title
# kameas-ci: check

# The squash-merge commit subject is the PR title (repo setting PR_TITLE),
# and tag-on-merge.yml reads that subject to decide whether a merge cuts a
# release and how far to bump. This check keeps every title a conventional
# commit so that decision is never ambiguous. Same configuration as the
# harness's pr-title.yml.

# Manual only (owner decision 2026-10-30). Dispatch on the PR's branch
# (`gh workflow run pr-title.yml --ref <branch>`); the check looks up the open
# PR for that branch and validates its title. The job name
# `Conventional Commits` is a REQUIRED status check — do not rename it.
# (amannn/action-semantic-pull-request only works on pull_request events, so
# the check is inline.)
on:
  workflow_dispatch:

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a Conventional Commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only PRs whose head is this repo's branch: a fork PR with the
          # same branch name must not be picked up.
          owner="${GITHUB_REPOSITORY%%/*}"
          title=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$GITHUB_REF_NAME" --jq '.[0].title // ""')
          [ -n "$title" ] || { echo "::error::no open PR for $GITHUB_REF_NAME"; exit 1; }
          echo "PR title: $title"
          # Same type list and subject rule as the harness's pr-title.yml:
          # optional lowercase scope; subject non-empty, not starting with
          # whitespace/a period, not ending with a period/space.
          re='^(feat|fix|perf|revert|deps|docs|style|chore|refactor|test|build|ci)(\([a-z0-9][a-z0-9._/,-]*\))?!?: [^[:space:].](.*[^. ])?$'
          [[ "$title" =~ $re ]] || { echo "::error::PR title is not a Conventional Commit: $title"; exit 1; }
          echo "OK"

  # Manual CI: required status checks ignore check runs from workflow_dispatch,
  # so mirror every job's result as a commit status with the job's name.
  report-statuses:
    name: report statuses
    needs: [conventional-commits]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      # Public repo: inlined from kameas-ai/.github/actions/report-statuses.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # filter=latest: after "re-run failed jobs", report each job's newest attempt.
          jobs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            -q '.jobs[] | select(.status == "completed") | [.name, .conclusion, .html_url] | @tsv')"
          [ -n "$jobs" ] || { echo "::error::no completed jobs in run $GITHUB_RUN_ID"; exit 1; }
          while IFS=$'\t' read -r name conclusion url; do
            case "$conclusion" in success|skipped|neutral) state=success ;; *) state=failure ;; esac
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" -f context="$name" -f target_url="$url" \
              -f description="$conclusion (${GITHUB_WORKFLOW:0:80})" >/dev/null
            printf '%-50s %s\n' "$name" "$state"
          done <<< "$jobs"
