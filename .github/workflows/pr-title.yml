name: PR Title

# The squash-merge commit subject is the PR title (repo setting PR_TITLE),
# and tag-on-merge.yml reads that subject to decide whether a merge cuts a
# release and how far to bump. This check keeps every title a conventional
# commit so that decision is never ambiguous. Same configuration as the
# harness's pr-title.yml.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            deps
            docs
            style
            chore
            refactor
            test
            build
            ci
          requireScope: false
          subjectPattern: ^[^\s.][^\n]*[^. ]$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}" is invalid.
            It must:
              - not start with whitespace or a period
              - not end with a period or trailing space
              - not be empty
