name: tag-on-merge

# Cuts a SemVer tag + GitHub Release from the conventional commits merged
# since the last release. Inline copy of the
# harness's tag-on-merge.yml (kenaz-harness/.github/workflows/tag-on-merge.yml)
# adapted to GitHub-hosted runners; keep the two in sync.
#
# Mapping (the squash-merged PR title becomes the commit subject verbatim —
# the repo's squash settings are PR_TITLE / PR_BODY, enforced by the
# "Conventional Commits" PR check in pr-title.yml):
#   feat(scope)?:        → minor (0.x.0)
#   fix|perf|revert|deps → patch (0.x.y)
#   feat!: / BREAKING CHANGE in body → major, capped to minor while < 1.0.0
#   docs|chore|ci|style|refactor|test|build → no release
#
# Source of truth: git tags. The next version = bump(latest `vX.Y.Z` tag).
# No CHANGELOG file maintained — release notes are GitHub's auto-generated
# "What's Changed" body.
#
# After tagging, dispatches ci.yml (frozen bundles, notarization, release
# assets, prod publication) and release.yml (sdist + wheel) against the new
# tag. GITHUB_TOKEN-created tags do not fire `on: push: tags`, so the
# explicit workflow_dispatch is required.
#
# RELEASE ON MERGE IS OPT-IN (2026-10). Two ways to run:
#
#   1. Manual (default): Actions → tag-on-merge → "Run workflow" on main, or
#        gh workflow run tag-on-merge.yml -R kameas-ai/kenaz-ml --ref main \
#          [-f bump=auto|patch|minor|major]
#      pyproject.toml must already carry the resulting version.
#   2. Automatic: set the repository variable AUTO_RELEASE=true
#      (Settings → Secrets and variables → Actions → Variables). Every push
#      to main then tags + releases (and ci.yml builds, notarizes and
#      publishes main to the dev channel), as before. Unset/anything else →
#      pushes to main run lint/tests only.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. auto = highest conventional-commit bump since the last tag.'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: tag-on-merge
  cancel-in-progress: false

jobs:
  bump-and-release:
    name: Bump version + cut release
    # Push-to-main runs only when AUTO_RELEASE=true; manual runs only on main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_RELEASE == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # tag + release
      actions: write      # workflow_dispatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # tags + history needed to find the latest tag

      - name: classify commits + compute next version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          # Empty on push; auto|patch|minor|major on workflow_dispatch.
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Latest semver tag (default v0.0.0 if none).
          LAST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          LAST=${LAST:-v0.0.0}

          # HEAD already carries a release tag → nothing to cut (a re-run, or a
          # manual dispatch right after an automatic tag).
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already tagged $(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1); skipping."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Classify EVERY commit since LAST and take the highest bump. On an
          # automatic (per-merge) run this is just the merged commit plus any
          # non-releasing commits before it; on a manual run with
          # AUTO_RELEASE off it is every merge that has accumulated since the
          # last release.
          if git rev-parse -q --verify "refs/tags/$LAST" >/dev/null; then
            RANGE="$LAST..HEAD"
          else
            RANGE="HEAD"
          fi
          # Parse conventional-commit prefix:
          #   <type>[(scope)][!]: <subject>
          # Hold the regex in a variable — bash's `[[ =~ ]]` parser chokes
          # on nested `[[:space:]]` POSIX classes when the regex is inline
          # (the `[[` is misread as a nested test expression).
          re='^([a-z]+)(\([^)]+\))?(!?):[[:space:]]'
          rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }
          BUMP="none"
          BREAKING=false
          COUNT=0
          while read -r SHA; do
            COUNT=$((COUNT+1))
            # Skip self-tagging-bot commits.
            if [[ "$(git log -1 --pretty=%ae "$SHA")" == *"github-actions[bot]"* ]]; then
              continue
            fi
            SUBJECT=$(git log -1 --pretty=%s "$SHA")
            BODY=$(git log -1 --pretty=%B "$SHA" | tail -n +3)
            [[ "$SUBJECT" =~ $re ]] || continue
            TYPE="${BASH_REMATCH[1]}"
            BANG="${BASH_REMATCH[3]}"
            case "$TYPE" in
              feat)                 B="minor" ;;
              fix|perf|revert|deps) B="patch" ;;
              *)                    B="none"  ;;
            esac
            # Breaking: trailing `!` after type/scope, or BREAKING CHANGE /
            # BREAKING-CHANGE token in the commit body.
            if [ -n "$BANG" ] || echo "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then
              B="major"
              BREAKING=true
            fi
            echo "  ${SHA:0:7} $B  $SUBJECT"
            if [ "$(rank "$B")" -gt "$(rank "$BUMP")" ]; then BUMP="$B"; fi
          done < <(git rev-list --no-merges "$RANGE")
          echo "Classified $COUNT commit(s) in $RANGE → bump=$BUMP"

          # A manual dispatch may force the bump level (e.g. to ship an
          # accumulation of chore/build commits).
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$BUMP_INPUT" ] && [ "$BUMP_INPUT" != "auto" ]; then
            echo "::notice::bump forced to '$BUMP_INPUT' by workflow_dispatch input (computed: $BUMP)"
            BUMP="$BUMP_INPUT"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "No release-worthy commits in $RANGE."
            [ "$EVENT" = "workflow_dispatch" ] && echo "::warning::No feat/fix/perf/revert/deps commits since $LAST — nothing tagged. Re-run with bump=patch|minor|major to force one."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=${LAST#v}
          IFS=. read -r MAJ MIN PAT <<<"$BASE"

          # Pre-1.0 cap: breaking bumps minor instead of major while at 0.x.
          if [ "$MAJ" = "0" ] && [ "$BUMP" = "major" ]; then
            BUMP="minor"
            echo "::notice::Pre-1.0 cap — breaking change bumps minor instead of major"
          fi

          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          NEXT="v${MAJ}.${MIN}.${PAT}"

          echo "Last tag: $LAST → next: $NEXT (bump=$BUMP, breaking=$BREAKING)"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LAST" >> "$GITHUB_OUTPUT"
          {
            echo "## tag-on-merge ($EVENT)"
            echo ""
            echo "- commits: $COUNT in \`$RANGE\`"
            echo "- bump: \`$BUMP\` (breaking=$BREAKING)"
            echo "- $LAST → **$NEXT**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: check the tag agrees with pyproject.toml
        if: steps.ver.outputs.bump != 'none'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # The engine reports pyproject's version at runtime and the publish
          # job labels prod artifacts by the tag; a mismatch would ship a
          # binary that calls itself one version under another's label.
          PY=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "v$PY" != "$TAG" ]; then
            echo "::error::pyproject.toml says $PY but the next release tag is $TAG; bump pyproject.toml in the release-worthy PR (or land a version bump first)"
            exit 1
          fi

      - name: generate release notes
        if: steps.ver.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:  ${{ steps.ver.outputs.tag }}
          PREV: ${{ steps.ver.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [ "$PREV" = "v0.0.0" ] && ! git rev-parse "$PREV" >/dev/null 2>&1; then
            echo "Initial release $TAG." > notes.md
          else
            gh api -X POST repos/$GITHUB_REPOSITORY/releases/generate-notes \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$PREV" \
              --jq .body > notes.md \
              || echo "Automated release for $TAG." > notes.md
          fi

      - name: tag + release
        if: steps.ver.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: dispatch the release builds against the tag
        if: steps.ver.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # ci.yml at the tag: frozen bundles, notarization, GitHub Release
          # assets, publication to the prod bucket + CDN.
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
          # release.yml at the tag: sdist + wheel on the same release.
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched ci.yml and release.yml for $TAG"
