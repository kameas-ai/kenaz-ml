# Occurrence Map — kenaz-ml Rebrand (WP01, rev 2)
#
# Mission: kenaz-ml-rebrand-01KZ1AMQ   Change mode: bulk_edit
# Revised 2026-08-02 after review rejection. rev 1 violated this schema (invented
# action values, no `target`), overcounted the do-not-change surface, and blamed
# the plan for occurrences that were its own paperwork. status.revision_history
# records each error rather than dropping it.
#
# Schema permits only: target, categories, exceptions, status.
# Analysis therefore lives under `status`.

target:
  term: sigil_ml
  replacement: kenaz_ml
  operation: rename
categories:
  code_symbols:
    action: rename
    occurrences: 647
    files: 84
    note: src/sigil_ml/ -> src/kenaz_ml/ via `git mv` (D-002), plus every identifier-position
      reference. No module moves.
    kameas_ml_occurrences: 259
    kameas_ml_files: 34
    kameas_ml_measurement: git grep -oP 'kameas[-_]ml' -- ':!kitty-specs' ':!.worktrees' =
      259/34 (pyproject.toml holds 8). A reviewer measuring 'kameas-ml' hyphen-only got 258/7;
      the delta is the underscore form in the editable-install .pth name.
  import_paths:
    action: rename
    occurrences: 380
    files: 66
    scope:
    - src/
    - tests/
    - scripts/
    note: Statement-shaped imports fail loudly at collection if missed, making this the safest
      category. The dangerous forms are in `string_resolved`.
    measurement: git grep -oP '^\s*(?:from|import)\s+sigil_ml'
    correction: 'rev 2 said 229/40, which was actually ''sigil_ml occurrences in src/'' —
      a different measurement wearing this label. Real import statements: 385/68.'
    correction_wp02: Measured 385/68 at WP01; WP02's actual rename touched 380/66. The map
      figure counted 5 matches in files not carrying real import statements.
  filesystem_paths:
    action: manual_review
    note: MIXED — this is the category that can destroy the product. Some paths rename, one
      must never.
    rename:
    - path: src/sigil_ml/
      to: src/kenaz_ml/
    - path: freeze/kameas-ml.spec
      to: freeze/kenaz-ml.spec
    - file: .gitignore
      line: 64
      text: src/sigil_ml/feature_store/registry.db
      why: if missed, registry.db becomes tracked after the package move
    - file: .pyre_configuration
      line: 2
      text: '{"root": "src", "subdirectory": "sigil_ml"}'
      why: if missed, pyre type-checks nothing
    do_not_change:
    - path: ~/.local/share/sigild/
      occurrences: 15
      why: THE critical invariant. config.py:59 hardcodes `_data_home() / "sigild" / "data.db"`.
        Renaming points every install at a database that does not exist WHILE IMPORTING PERFECTLY
        — it would look like the rename worked and fail only at runtime.
      measurement: git grep -oP 'share/sigild' -> 15 occ / 11 files. rev 2 said 70, which
        was the repo-wide figure including kitty-specs/.
    - path: ~/.local/share/sigild/ml-models/
  serialized_keys:
    action: manual_review
    note: Two sub-cases with opposite answers. One needs a product decision that rev 1 missed
      entirely.
    artifacts_verified_clean:
      registry_db:
        path: src/sigil_ml/feature_store/registry.db
        size_bytes: 55
        sigil_ml_hits: 0
      joblib:
        path: ~/.local/share/sigild/ml-models/*.joblib
        probed: 5
        dirty: 0
      reasoning: 'Re-probed per D-006 and independently re-probed at review. Clean, as expected:
        the pickled objects are plain sklearn estimators, so no project module path is recorded.
        FR-010 should hold with no artifact regeneration.'
    env_vars_NEEDS_DECISION:
      pattern: SIGIL_ML_*
      occurrences: 21
      files: 8
      members:
        SIGIL_ML_MODE: 12
        SIGIL_ML_TEST_POSTGRES_URL: 3
        SIGIL_ML_SRC: 2
        SIGIL_ML_TRAIN_MIN_TASKS: 1
        SIGIL_ML_TRAIN_MIN_INTERVAL: 1
        SIGIL_ML_TRAIN_MAX_TASKS_PER_TENANT: 1
        SIGIL_ML_LOCK_TIMEOUT_SEC: 1
      found_in:
      - src/sigil_ml/app.py, cli.py, config.py
      - src/sigil_ml/training/locking.py
      - freeze/kameas-ml.spec
      - docs/, tests/
      why_a_decision_and_not_a_default: These are THIS product's own environment variables
        — distinct from SIGILD_* which belong to the ledger and never change. Renaming them
        to KENAZ_ML_* completes the rebrand but BREAKS every existing deployment, container
        spec, systemd unit and shell profile that sets them. The skill's default posture for
        serialized_keys is do_not_change precisely because config keys are contracts with
        people, not just with code.
      options:
      - id: A
        action: rename to KENAZ_ML_*
        cost: silent breakage of existing configs; the var is simply ignored
      - id: B
        action: rename with a deprecation shim reading the old name and warning
        cost: a little code, one release of carrying both
      - id: C
        action: do_not_change
        cost: the rebrand is visibly incomplete in `env | grep`
      status: 'RESOLVED 2026-08-02 by the product owner: option B.'
      decision:
        chosen: B — rename to KENAZ_ML_*, with a deprecation shim reading the old name
        behaviour: 'Read KENAZ_ML_<X>. If unset and SIGIL_ML_<X> is set, use it and emit a
          deprecation warning naming both. Precedence: new wins when both are set.'
        why: Renaming alone breaks existing deployments quietly — an unrecognised env var
          is simply ignored, so a container that sets SIGIL_ML_MODE=cloud would silently fall
          back to local. The shim converts that into a visible warning.
        traps:
        - src/sigil_ml/cli.py:96 WRITES os.environ['SIGIL_ML_MODE'] = mode.value. If the write
          keeps the old name while the read gains a fallback, the product emits a deprecation
          warning about its own internal handoff on every CLI-started run. The write must
          move to the new name in the same change.
        - src/sigil_ml/training/locking.py:15 reads at MODULE IMPORT TIME (STALE_LOCK_TIMEOUT_SEC
          = int(os.environ.get(...))), so its warning fires at import, before logging is configured.
          Route it through the helper anyway and accept that its warning may land on stderr
          rather than the configured logger.
        - Access is scattered across 6 modules (cli, config, logging_config, modelstore/cache,
          tenant, training/locking) with no single accessor. The helper is new code, not a
          rename — the one place this mission adds behaviour.
        sites:
        - src/sigil_ml/config.py:43 (SIGIL_ML_MODE)
        - src/sigil_ml/cli.py:96 (write), :272, :273, :276 (SIGIL_ML_TRAIN_*)
        - src/sigil_ml/training/locking.py:15 (SIGIL_ML_LOCK_TIMEOUT_SEC)
        - tests/ (SIGIL_ML_TEST_POSTGRES_URL), freeze/*.spec (SIGIL_ML_SRC)
      scope_was_too_narrow: rev 2 asserted SIGIL_ML_* and SIGILD_* were the only two families.
        FALSE — it erased a third, 3x larger, also product-owned. See env_vars_SIGIL_family
        below.
    env_vars_SIGIL_family:
      pattern: SIGIL_* (case-sensitive, excluding SIGIL_ML_*)
      occurrences: 65
      files: 15
      members:
        SIGIL_MODE: 17
        SIGIL_POSTGRES_URL: 17
        SIGIL_MODEL_*: 12
        SIGIL_S3_*: 9
        SIGIL_TENANT*: 8
        SIGIL_CLOUD_ARCHITECTURE: 2
      ownership: THIS PRODUCT. All read by src/sigil_ml/config.py. Not the ledger's.
      evidence: config.py:124 SIGIL_MODE, :136 SIGIL_POSTGRES_URL, :145 SIGIL_TENANT, :155
        SIGIL_S3_BUCKET, :160 SIGIL_S3_ENDPOINT_URL
      why_rev2_missing_this_was_serious: config.py:43 reads SIGIL_ML_MODE and config.py:124
        reads SIGIL_MODE — twelve lines apart in one file. rev 2 listed the first as a rename
        site and made the second invisible, so an implementer renames one and leaves the other.
        Worse, rev 2's 242 was labelled 'the in-scope daemon surface' while ~27% of it was
        this product's own config keys — WP02 would have committed a test asserting a false
        belief about ownership.
      decision: 'B-extended (product owner, 2026-08-02): same treatment as SIGIL_ML_* — rename
        to KENAZ_* with a deprecation shim reading the old name and warning; new name wins
        when both are set.'
      blast_radius_note: Mostly cloud-path configuration (Postgres URL, S3, tenancy), so breakage
        lands on container specs and deployment manifests rather than a developer's shell
        profile.
      corrections_from_wp02:
      - SIGIL_ML_SRC is a module-level variable in the PyInstaller spec file, NOT an env var.
        It needs renaming but no shim.
      - SIGIL_CLOUD_ARCHITECTURE is a FILENAME (docs/SIGIL_CLOUD_ARCHITECTURE.md), not an
        env var. The map counted it in the 65.
      - Of the 6 modules the map named for env routing, logging_config and modelstore/cache
        have NO SIGIL_* vars at all — they read XDG_DATA_HOME and unprefixed MODEL_CACHE_*.
    env_vars_KAMEAS_family:
      pattern: KAMEAS_ML_FROZEN_BIN
      occurrences: test-harness only
      ownership: THIS PRODUCT — a 4th family the map omitted entirely.
      action: renamed by WP02; no shim needed (test harness, not user configuration).
      found_by: WP02 implementation, not by any of WP01's three revisions.
  cli_commands:
    action: rename
    note: 'The skill''s default here is do_not_change (users'' scripts break), but renaming
      the command IS the request — FR-003. Flagging the tradeoff rather than silently taking
      it: anyone with `kameas-ml` in a script or alias will get command-not-found after upgrading.'
    sites:
    - file: pyproject.toml
      line: 79
      text: kameas-ml = "sigil_ml.cli:main"
      why: both halves change; resolved by the installer
    - file: .github/workflows/ci.yml
      lines:
      - 101
      - 114
      - 120
      - 156
      - 160
      - 200
      - 211
      - 217
      text: kameas-ml serve | train | health-check
    - file: Makefile
      occurrences: 8
  user_facing_strings:
    action: rename_if_user_visible
    sites:
    - file: src/sigil_ml/logging_config.py
      occurrences: 6
    - files: app.py(4) cli.py(4) config.py(2) routes.py(3)
      example: 'logger.info("kameas-ml: using %s data backend", ...)'
    - file: src/sigil_ml/app.py
      line: 215
      text: title="kameas-ml"
      why: FastAPI title — surfaces in the OpenAPI schema and generated docs
    - file: src/sigil_ml/modelstore/registry/manifest.py
      line: 816
      text: '"sigil_ml.feature_store.definitions.FEATURE_SERVICES declares..."'
      why: a module path embedded in an error message
    - file: src/sigil_ml/feature_store/resolve.py
      line: 540
      text: name="sigil-ml-feature-push"
      why: hyphenated variant
  tests_fixtures:
    action: rename
    occurrences: 343
    files: 24
    exception: tests/test_migration_regression.py
  logs_telemetry:
    action: rename
    note: Default posture is do_not_change (dashboards key off exact strings), but FR-005
      mandates renaming the prefixes and no external dashboard consumes them — this is a local
      sidecar. Overlaps user_facing_strings; logging_config.py is the hub.
    occurrences: 3
    measurement: git grep -oP 'kameas-ml:' -- src   (actual log-prefix literals)
    correction: rev 2 said 17, unreproducible. Only 3 literal 'kameas-ml:' prefixes exist
      in src/. The wider set of user-visible strings is in user_facing_strings.
exceptions:
- path: kitty-specs/**
  action: do_not_change
  reason: Historical records of already-merged missions (D-003, FR-013). Rewriting them makes
    the audit trail lie — a reader would find a mission describing a move of kenaz_ml/store.py,
    a path that never existed under that name. 1163 sigil_ml + 199 kameas-ml occurrences live
    here and are all excluded. This mission's OWN directory uses current naming.
- path: tests/test_migration_regression.py
  action: manual_review
  reason: Contains the one reference where keeping the old name is CORRECT. See git_object_references
    below.
- path: '**/sigild/**'
  action: do_not_change
  reason: the ledger's data path — see filesystem_paths.do_not_change
- path: .worktrees/**
  action: do_not_change
  reason: Untracked husk of the merged storage-layer-reorganization lane. Its src/sigil_ml/
    tree, .pyre/taint_models/sources_sinks.pysa and freeze/kameas-ml.spec still carry old
    names. Not a correctness hazard (gitignored, branch merged), but anyone verifying WP02
    with a plain `grep -r` instead of `git grep` will see a tree of false leftovers.
status:
  secondary_targets:
  - term: kameas-ml
    replacement: kenaz-ml
    operation: rename
    note: distribution name, CLI command, log prefixes
  - term: sigil-ml
    replacement: kenaz-ml
    operation: rename
    note: hyphenated variant, 3 occurrences, missed by rev 1
  - term: github.com/kameas-ai/kameas-ml
    replacement: github.com/kameas-ai/kenaz-ml
    operation: rename
    note: 9 occurrences in 3 files. The org `kameas-ai` is unchanged. These URLs are ALREADY
      STALE — `git remote -v` is git@github.com:kameas-ai/kenaz-ml.git, so package metadata
      currently points at a repository name that no longer exists. Rev 1 listed this rename
      but enumerated no occurrences.
  do_not_change_surface:
    measurement: git grep -oPi 'sigil(?!_ml\b)(?!-ml\b)(?!_[A-Z])' -- ':!kitty-specs' ':!.worktrees'
    in_scope_total:
      occurrences: 163
      files: 39
    breakdown:
      sigild:
        occurrences: 95
        files: 32
      sigilctl:
        occurrences: 11
        files: 7
      daemon_urls:
        occurrences: 9
        files: 6
      bare_Sigil_prose_and_remainder:
        occurrences: 48
    supersedes: rev 2's 242/46. That figure counted 65 product-owned SIGIL_* vars and 5 hyphenated
      sigil-ml as though they were the ledger's. 242 - 65 - 5 - overlap = 163.
    wp02_instruction: Assert 163 in-scope / 95 sigild, using the pattern above — it must exclude
      SIGIL_<UPPERCASE> or it re-counts this product's own config keys as the ledger's. Do
      NOT assert 138, 524 or 242.
    measurement_correction: The pattern MUST be run case-INsensitively (-oPi). With -oP it
      yields 149/38, not 163/39. Conversely test_rebrand.py must match sigil_ml case-SENSITIVELY,
      or it flags the SIGIL_ML_* names the FR-014 shim legitimately needs. The map states
      -oPi; recording explicitly because this mission has been bitten by case-sensitivity
      four separate times.
    exact_equality_outside_shim:
      occurrences: 153
      measurement: LEDGER_PATTERN excluding tests/test_rebrand.py, src/kenaz_ml/config.py,
        tests/test_env_deprecation_shim.py, tests/test_registry_guarantees.py
      holds_on: both main (163-6-4) and the rename branch (181-12-10-6)
      why: The broad >= floor tolerates prose drift because FR-014's shim must NAME the daemon
        to exclude it. This equality is the assertion with teeth; mutation-tested to fail
        on a single renamed prose reference.
      asserted_in: tests/test_rebrand.py::test_the_ledger_surface_outside_the_shim_is_exactly_unchanged
  string_resolved:
  - file: src/sigil_ml/cli.py
    line: 98
    text: '"sigil_ml.app:app"'
    resolved_by: uvicorn at server start
    verify: start the server THROUGH THE CLI
    not uvicorn directly: null
  - file: freeze/kameas-ml.spec
    line: 267
    text: '"sigil_ml.app" (hiddenimports)'
    resolved_by: PyInstaller at build
    verify: build the binary AND serve a real prediction from it
    note: the explanatory comment on line 265 names the same string
  - file: pyproject.toml
    line: 79
    text: kameas-ml = "sigil_ml.cli:main"
    resolved_by: the installer writing the console script
  - file: pyproject.toml
    line: 106
    text: known-first-party = ["sigil_ml"]
    resolved_by: ruff isort
    why: if missed, every first-party import regroups as third-party and `ruff format --check`
      fails across the tree
  - file: pyproject.toml
    lines: 5-6
    action: REWRITE_NOT_RENAME
    text: '# the import package is still `sigil_ml` (the module path is kept for WAL-contract
      and legacy import-compat reasons)'
    why: this comment explains why the package and distribution names diverged. After this
      mission they agree, so substituting the strings leaves a comment that contradicts itself.
  - file: (editable install)
    text: __editable__.kameas_ml-*.pth
    resolved_by: site-packages at interpreter start
    action: reinstall after the rename; a stale .pth silently breaks imports
  git_object_references:
  - file: tests/test_migration_regression.py
    lines: 909-917
    key: sys.modules["sigil_ml.store"]
    action: do_not_change_the_key
    value_action: point it at the renamed module
    source: ef67e05:src/sigil_ml/features.py:13
    source_kind: commit-ish path (rev 1 called this a "blob"; it is a commit)
    contains: from sigil_ml.store import DataStore
    guards:
    - PRE_MIGRATION_SHA
    - PRE_MIGRATION_FEATURES_SHA256
    - hashlib.sha256 assertion ~L885
    why: The test asserts the source's SHA256 immediately before exec'ing it, so the historical
      text can never change. The alias key exists to satisfy an import inside that frozen
      source — it must match history, not current code. No working-tree grep can see this;
      it broke a previous bulk edit here and was found by running the suite.
    reviewer_note: A reviewer scanning for leftovers WILL flag this. It is correct. WP02 must
      add a comment at the site saying so.
  - file: tests/test_serving_regression.py
    line: 190
    action: do_not_change_the_historical_path
    why: 'A second frozen-history site the map never listed. Same class as the test_migration_regression.py
      alias: a historical path that must not follow the rename.'
    found_by: WP02 implementation.
  scope_additions:
    status: ALREADY APPLIED. WP02's owned_files was extended in commit e2fd389 to cover all
      seven. Rev 1 listed this as an open finding; it is closed.
    files:
    - path: .pyre/taint_models/sources_sinks.pysa
      impact: high
      verified: 'line 4 is exactly `def sigil_ml.routes.predict_stuck(req: TaintSource[UserInput]):
        ...`, 5 route entries'
      correction_to_rev1: Rev 1 claimed a stale path fails SILENTLY — "no error, no warning,
        a green build". That is WRONG and was corrected at review. Pysa validates models against
        named callables and raises InvalidModelError for undefined ones; `pyre analyze` fails
        by default and suppression is an explicit opt-out. The impact direction is right (taint
        coverage over every /predict endpoint is lost) but it is loud, not silent.
      also_contains: 'line 1: ''# Sigil-ML Pysa taint model definitions.'' — the hyphenated
        brand form'
    - path: .pyre/taint_models/taint.config
      impact: low
      verified: 'line 2: ''Sigil-ML taint configuration for Pysa security analysis'''
      note: covered by WP02's .pyre/** ownership; enumeration gap only in rev 2.
    - path: .pyre_configuration
      impact: high
      verified: true
    - path: .gitignore
      impact: high
      verified: true
    - path: prd.json
      impact: medium
      note: live planning doc — rename
    - path: .kittify/memory/constitution.md
      impact: medium
      note: live governance, titled "kameas-ml Constitution" — rename
    - path: tasks/prd-classify-predict-pipeline.md
      impact: medium
    - path: tasks/companion-sigil-daemon-changes.md
      impact: medium
      note: MIXED FILE. Rename kameas-ml; keep every sigil. Do NOT rename the file itself
        — "sigil-daemon" in the filename is correct.
  open_questions:
  - id: Q4
    question: SIGIL_MODE and SIGIL_ML_MODE both exist and both select local-vs-cloud.
    blocks: nothing — filed as a separate issue at the product owner's direction
    detail: config.py:43 resolve_mode() reads SIGIL_ML_MODE; config.py:124 reads SIGIL_MODE.
      Two switches for one decision. This mission renames both to KENAZ_* and PRESERVES the
      duplication under new names. Consolidating them is a behaviour change and must not be
      smuggled into a rename.
  - id: Q5
    question: The Pysa taint model covers nothing and has been stale for some time.
    blocks: nothing in this mission
    severity: security tooling — no runtime impact
    detail: '.pyre/taint_models/sources_sinks.pysa declares 5 taint sources as module-level
      callables: kenaz_ml.routes.predict_stuck, .predict_suggest, .predict_duration, .predict_quality,
      .train. None of these exist at module level — routes.py defines them as NESTED async
      functions inside register_routes() (line 182), so their real paths are kenaz_ml.routes.register_routes.<locals>.predict_stuck.
      Pysa cannot resolve the declared paths, so taint coverage over every user-facing /predict
      endpoint is absent, and was absent before this rename. WP02 renamed the prefix; restoring
      coverage is a REPAIR and was correctly kept out of a rename mission. Needs its own issue.'
  revision_history:
    rev1_rejected_at_review:
    - error: Schema violation — invented action values (mixed, none_required, rename_except_one)
        and omitted the required `target` section.
      consequence: spec-kitty's bulk-edit gate refused to let the review be claimed. The mission
        could not advance.
    - error: Do-not-change surface stated as 524/97.
      wrong_three_ways: '(a) only reachable case-insensitively, while the stated pattern `sigil(?!_ml)`
        is case-sensitive and yields 286; (b) repo-wide, including the kitty-specs/ the same
        map forbids touching; (c) included the map file''s own 45 self-references, making
        it unstable on every edit. Correct in-scope figure: 242/46.'
      consequence: was committed into spec.md and WP02 T010 before review.
    - error: Reconciliation claimed the pre-planning grep "UNDERCOUNTED" by +72 and +38.
      truth: This mission''s own spec directory — written AFTER the pre-planning measurement
        — contains 75 sigil_ml and 40 kameas-ml. The deltas are the mission''s own paperwork.
        The earlier grep was not wrong; rev 1 measured itself and blamed the plan.
    - error: Modified spec.md and WP02-the-rename.md while owning only occurrence_map.yaml
        (commits 42ccf73, e2fd389).
      consequence: violated its own Definition of Done ("No source file modified") and shipped
        the bad 524/194 downstream.
    - error: Claimed the .pysa failure is silent.
      truth: Pysa raises InvalidModelError; pyre analyze fails by default.
    - error: Claimed the stale worktree's src/ is empty.
      truth: It contains src/sigil_ml/, its own .pyre taint model, and freeze/kameas-ml.spec.
    - error: Missed the SIGIL_ML_* env vars (21 occurrences) entirely, plus the hyphenated
        sigil-ml variant and the 9 GitHub URL references.
    rev1_confirmed_correct:
    - The partition itself. No instance of ~/.local/share/sigild/, SIGILD_*, sigilctl or sigild
      was ever classified as rename. The failure this mission exists to prevent was not present.
    - sigil_ml in-scope 647/84 — exact match on independent re-derivation.
    - 'Artifact re-probe: registry.db 0 hits, 5/5 joblib clean.'
    - The git-object alias entry and its reasoning.
    - All 7 out-of-scope files exist and carry the claimed content.
    rev2_rejected_at_review:
    - error: Erased the SIGIL_* env-var family (65 occ / 15 files), asserting a false two-family
        split. 3x larger than the SIGIL_ML_* set Q1 was about.
      consequence: config.py:43 listed as a rename site while config.py:124 was invisible;
        and 242 was labelled 'daemon surface' when 27% was product-owned.
    - error: 'import_paths 229/40 was ''sigil_ml in src/'' mislabelled. Real: 385/68.'
    - error: 'logs_telemetry 17 and share/sigild 70 unreproducible. Real: 3 and 15.'
    - error: No kameas-ml count in categories; no reconciliation against 138/1738/420.
    - error: rev1_confirmed_correct attested to a wp02_checklist key removed during the schema
        restructuring — an attestation to something not in the file.
    rev3_corrections_found_during_wp02:
    - SIGIL_ML_SRC is a spec-file variable, not an env var
    - SIGIL_CLOUD_ARCHITECTURE is a filename, not an env var
    - 2 of 6 named env-routing modules have no SIGIL_* vars
    - 'KAMEAS_ML_FROZEN_BIN: a 4th product-owned env family, omitted entirely'
    - test_serving_regression.py:190 is an unlisted frozen-history site
    - 'NOTE: the map called .pyre/taint_models/sources_sinks.pysa a high-impact rename site.
      It was pointing at callables that DO NOT EXIST and had been stale before this mission
      — see status.open_questions Q5.'
    corrections_that_were_themselves_overstated:
    - 'Claimed import_paths 385/68 -> 380/66. WRONG: 385/68 reproduces the map''s stated pattern
      exactly. 380/66 only holds under the narrower `scope:` key, which omits freeze/. No
      code consequence — all five freeze/ imports were renamed regardless.'
    - 'Claimed the ledger measurement needed -oPi rather than -oP. WRONG: the operative line
      (do_not_change_surface.measurement) ALREADY specified -oPi. Only a generic prose line
      elsewhere said -oP.'
    - Recorded because this mission's recurring failure has been asserting a number without
      reproducing it first, and both of these repeated it while purporting to fix it.
  measurement_scope: 'All counts are IN-SCOPE: git grep -oP <pattern> -- '':!kitty-specs''
    '':!.worktrees''. kitty-specs/ is excluded because D-003/FR-013 forbid rewriting merged
    missions'' records; .worktrees/ is an untracked husk. Counting either inflates the figure
