# Occurrence map — storage-layer-reorganization-01KYXE54 (WP01, NFR-004, C-006, D-006)
#
# Six modules move; every reference to them is rewritten. Nothing moves until
# this map is approved.
#
#   src/sigil_ml/store.py                 -> src/sigil_ml/datastore/protocol.py
#   src/sigil_ml/store_sqlite.py          -> src/sigil_ml/datastore/sqlite.py
#   src/sigil_ml/store_postgres.py        -> src/sigil_ml/datastore/postgres.py
#   src/sigil_ml/storage/model_store.py   -> src/sigil_ml/modelstore/stores.py
#   src/sigil_ml/loader.py                -> src/sigil_ml/modelstore/loader.py
#   src/sigil_ml/cache.py                 -> src/sigil_ml/modelstore/cache.py
#
# src/sigil_ml/storage/ disappears entirely.
#
# Method: `git grep` over tracked files only. This structurally excludes
# __pycache__, *.pyc, .venv, and the stale worktree under .worktrees/ — none of
# which are tracked — so no count here is inflated by a compiled artifact.
# `\b` is unsupported by git grep's default engine and silently returns zero
# matches; every pattern below was run with `-P`.
#
# Category actions are the gate-facing decision. They are also read by the
# review-time diff-compliance heuristic (specify_cli/bulk_edit/diff_check.py),
# which classifies each changed file to ONE category by path/extension:
#   tests/**, test_*.py        -> tests_fixtures
#   *.md, docs/**, README      -> user_facing_strings
#   *.yaml *.yml *.json *.toml -> serialized_keys
#   *.py (everything else)     -> code_symbols
#   anything unmatched         -> BLOCKS review
# The `exceptions:` block at the bottom exists to make that heuristic produce
# the right verdicts for this repo. Read it before changing any action.

target:
  term: "sigil_ml.store | sigil_ml.store_sqlite | sigil_ml.store_postgres | sigil_ml.storage(.model_store) | sigil_ml.loader | sigil_ml.cache"
  replacement: "sigil_ml.datastore(.protocol|.sqlite|.postgres) | sigil_ml.modelstore(.stores|.loader|.cache)"
  operation: rename

categories:

  # =====================================================================
  # 1. code_symbols
  # =====================================================================
  code_symbols:
    action: rename
    summary: >-
      No public symbol is renamed. C-001 forbids logic, signature, or default
      changes and D-002 keeps the moves 1:1, so every class and function keeps
      its name; what changes inside .py files is the module path it is reached
      through. The action is `rename` because the diff heuristic files every
      src/**/*.py under this category and those files must be modifiable.
    symbols_that_do_not_change:
      - {name: DataStore,             from: src/sigil_ml/store.py:17,               to: src/sigil_ml/datastore/protocol.py}
      - {name: create_store,          from: src/sigil_ml/store.py:166,              to: src/sigil_ml/datastore/protocol.py}
      - {name: SqliteStore,           from: src/sigil_ml/store_sqlite.py:19,        to: src/sigil_ml/datastore/sqlite.py}
      - {name: PostgresStore,         from: src/sigil_ml/store_postgres.py:19,      to: src/sigil_ml/datastore/postgres.py}
      - {name: ModelStore,            from: src/sigil_ml/storage/model_store.py:21, to: src/sigil_ml/modelstore/stores.py}
      - {name: LocalModelStore,       from: src/sigil_ml/storage/model_store.py:37, to: src/sigil_ml/modelstore/stores.py}
      - {name: S3ModelStore,          from: src/sigil_ml/storage/model_store.py:87, to: src/sigil_ml/modelstore/stores.py}
      - {name: CachedModelStore,      from: src/sigil_ml/storage/model_store.py:182, to: src/sigil_ml/modelstore/stores.py}
      - {name: model_store_factory,   from: src/sigil_ml/storage/model_store.py:245, to: src/sigil_ml/modelstore/stores.py}
      - {name: ModelLoader,           from: src/sigil_ml/loader.py:17,              to: src/sigil_ml/modelstore/loader.py}
      - {name: FilesystemModelLoader, from: src/sigil_ml/loader.py:40,              to: src/sigil_ml/modelstore/loader.py}
      - {name: ModelCache,            from: src/sigil_ml/cache.py:33,               to: src/sigil_ml/modelstore/cache.py}
      - {name: create_model_cache,    from: src/sigil_ml/cache.py:158,              to: src/sigil_ml/modelstore/cache.py}
      - {name: DEFAULT_TTL_SECONDS,   from: src/sigil_ml/cache.py:21,               to: src/sigil_ml/modelstore/cache.py}
      - {name: DEFAULT_MAX_SIZE,      from: src/sigil_ml/cache.py:22,               to: src/sigil_ml/modelstore/cache.py}

    occurrences:
      - file: src/sigil_ml/storage/__init__.py
        line: 1-16
        current: 'Package docstring, re-export of 4 names from sigil_ml.storage.model_store, and __all__ = ["CachedModelStore", "LocalModelStore", "ModelStore", "model_store_factory"]'
        intended: >-
          Delete the file with the package (D-004: no shim at the old path).
          Its role is taken by src/sigil_ml/modelstore/__init__.py, which
          per plan.md §"Public import surface" also exports S3ModelStore,
          ModelLoader, FilesystemModelLoader, ModelCache and create_model_cache
          — all additive.
      - file: src/sigil_ml/feature_store/materialize.py
        line: 454
        current: '        data_store: A :class:`~sigil_ml.store.DataStore`. Reads only.'
        intended: '        data_store: A :class:`~sigil_ml.datastore.DataStore`. Reads only.'
        note: >-
          MISSED BY PLANNING'S COUNT. A dotted module path inside a Sphinx
          cross-reference in a docstring — not an import statement, so it is
          not one of the 41, and nothing fails if it is missed. It is the only
          occurrence in a file WP02 otherwise has no reason to open.

    planning_defect:
      what: >-
        `create_model_store` does not exist anywhere in the codebase. The real
        factory is `model_store_factory` (src/sigil_ml/storage/model_store.py:245),
        called at app.py:134 and cli.py:114.
      named_at:
        - kitty-specs/storage-layer-reorganization-01KYXE54/plan.md:92
        - kitty-specs/storage-layer-reorganization-01KYXE54/quickstart.md:49
        - kitty-specs/storage-layer-reorganization-01KYXE54/tasks/WP02-tests-then-move.md:169
      why_it_matters: >-
        All three instruct modelstore/__init__.py to export `create_model_store`.
        Taken literally WP02 either exports a name that does not exist
        (ImportError at package import — loud, but only after the move) or
        renames `model_store_factory` to match, which violates C-001 and FR-005.
      resolution_for_wp02: >-
        Export `model_store_factory`. Do not rename it. Correcting plan.md,
        quickstart.md and WP02's own text is a planning-artifact fix, outside
        this WP's single owned file.

