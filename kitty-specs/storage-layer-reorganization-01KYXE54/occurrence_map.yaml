# =========================================================================
# Exceptions — ordered; the FIRST match wins (diff_check._exception_for).
# These exist because the review-time heuristic classifies by path, and
# without them correct work would block and incorrect work would pass.
# =========================================================================
exceptions:

  - path: "kitty-specs/storage-layer-reorganization-01KYXE54/**"
    action: manual_review
    reason: >-
      This mission's own artifacts. Without this, occurrence_map.yaml (this
      file), status.json and lanes.json classify as serialized_keys ->
      do_not_change and would block WP01's own review, and spec-kitty rewrites
      status.json/lanes.json automatically on every claim. MUST STAY FIRST.

  - path: "kitty-specs/model-registry-and-base-refresh-01KYTW5S/**"
    action: manual_review
    reason: >-
      The follow-on mission carries a stale owned-file path
      (lanes.json:20 and WP05-integration.md:23,26 both name
      src/sigil_ml/loader.py). Whether it is fixed here or absorbed there is an
      open decision — see filesystem_paths.escalation_follow_on_mission. This
      permits either and warns on both.

  - path: "kitty-specs/**"
    action: do_not_change
    reason: >-
      Historical records of missions 001-005 and the sibling feast/
      feature-extraction missions. 29 of the 70 tracked import statements live
      here, describing what was true when written. Rewriting them falsifies the
      record; none is executable.

  - path: "docs/openapi.json"
    action: do_not_change
    reason: >-
      Needs an explicit exception because the heuristic's `docs/` rule outranks
      its `.json` rule, so this file classifies as user_facing_strings
      (rename_if_user_visible) and would otherwise be freely editable. C-004
      fixes the :7774 surface, so a diff here means behaviour changed. This
      makes the review gate agree with CI's `make openapi-check`.

  - path: "docs/plan.md"
    action: do_not_change
    reason: >-
      Superseded design document dated 2026-03-29. It describes a storage layout
      that was never built (sqlite_store.py, postgres_store.py, model_cache.py,
      local_model_store.py, s3_model_store.py). Editing it would invent history.
      docs/ML_ARCHITECTURE.md is the live document and is NOT excepted.

  - path: "freeze/*.spec"
    action: manual_review
    reason: >-
      `.spec` matches no path heuristic, so touching freeze/kameas-ml.spec would
      block review as unclassified surface. It is expected to need NO edit —
      collect_submodules("sigil_ml") at line 269 reaches relocated subpackages,
      and the only explicit sigil_ml hidden import is "sigil_ml.app" (line 267),
      which is not moving. FR-006/SC-004 require this be verified by building,
      not assumed; manual_review keeps a real edit visible rather than blocked.

  - path: "Makefile"
    action: do_not_change
    reason: >-
      Unclassified by the heuristic. Contains no module reference — targets are
      openapi/install/lint/format/test/build/freeze/freeze-smoke, all
      package-level. A diff here means something unplanned.

  - path: ".pyre_configuration"
    action: do_not_change
    reason: >-
      Unclassified by the heuristic. References sigil_ml at package level only
      ({"root": "src", "subdirectory": "sigil_ml"}); the move is invisible to it.

# =========================================================================
# status — T002 audit and T003 reconciliation
# =========================================================================
status:

  work_package: WP01
  produced_by: claude
  date: "2026-08-01"
  scope: "This map is the WP03 verification checklist. Nothing moves until it is approved (C-006, D-006)."

  # -------- T002 --------
  dynamic_reference_audit:
    verdict: >-
      CONFIRMED — no moving module is referenced by string anywhere in the
      repository. The plan's central safety claim holds. Every one of the 41
      references is a statement import, so a missed rewrite fails loudly at
      import or collection time; there is no silent-failure path.
    conclusion_independent_of_planning: true
    searches_run:
      - id: S1
        what: "importlib / __import__ / import_module / pkgutil / entry_points / load_entry_point / pkg_resources across src, tests, freeze, scripts, pyproject.toml, Makefile, .github"
        result: >-
          11 hits. 5 are prose comments about Feast's dynamic backend loading.
          tests/test_feature_store_defs.py:196 does
          importlib.import_module(f"sigil_ml.models.{info.name}") over
          pkgutil.iter_modules(sigil_ml.models.__path__) — scoped to
          sigil_ml.models, which is not moving.
          tests/test_migration_regression.py:893 uses spec_from_file_location on
          a checked-in pre-migration copy of features.py. No moving module.
      - id: S2
        what: 'every quoted string containing "sigil_ml" (regex ["'']([A-Za-z_]\w*\.)*sigil_ml[\w.:]*["'']) across src, tests, freeze, scripts, pyproject.toml, Makefile, .github, docs'
        result: >-
          26 hits, ZERO naming a moving module. The full set is: "sigil_ml.app:app"
          (src/sigil_ml/cli.py:98 and freeze/kameas-ml.spec:265 comment + :267
          hiddenimport); "sigil_ml.cli:main" (pyproject.toml:79);
          "sigil_ml.cli" as a -m target (tests/test_cloud_training.py:1091,1106,1129,1148);
          logger names "sigil_ml", "sigil_ml.feature_store.*", "sigil_ml.training.*";
          bundle path fragments "sigil_ml"/"feature_store"; Feast project name
          "sigil_ml"; and collect_submodules("sigil_ml") at freeze/kameas-ml.spec:269.
      - id: S3
        what: "mock.patch / patch.object / monkeypatch.setattr / getattr( across src, tests, freeze, scripts"
        result: >-
          26 hits. The only string-target patches are
          mock.patch("sigil_ml.features.time.time") and
          mock.patch("sigil_ml.features.time.localtime")
          (tests/test_features.py:221,240) — features.py is not moving. All
          monkeypatch.setattr calls pass module/class OBJECTS, which follow the
          move automatically. All getattr calls take attribute names on
          instances (last_modified, is_trained, model, _MEIPASS), not modules.
      - id: S4
        what: "any quoted string containing store/storage/loader/cache/model_store/store_sqlite/store_postgres across src, freeze, scripts, pyproject.toml, .github"
        result: >-
          25 hits after filtering feature-store noise. All are log message
          prefixes, docstrings, API response keys, or __all__ entries — none is
          a module path used for resolution. Itemised under logs_telemetry and
          serialized_keys.
      - id: S5
        what: "relative imports (from .X), `from sigil_ml import X`, and `import sigil_ml.X` forms — the shapes S1's import regex could not see"
        result: >-
          Zero relative imports in the whole package. `from sigil_ml import X`
          resolves only config, __version__ and features. `import sigil_ml.X`
          resolves only sigil_ml.models and sigil_ml.features. No moving module
          is reached by any of these forms, so none adds to the 41.
    string_referenced_modules_in_repo:
      - {module: "sigil_ml.app", form: "sigil_ml.app:app", sites: ["src/sigil_ml/cli.py:98", "freeze/kameas-ml.spec:265 (comment)", "freeze/kameas-ml.spec:267 (hiddenimports)"], moving: false}
      - {module: "sigil_ml.cli", form: "sigil_ml.cli:main", sites: ["pyproject.toml:79"], moving: false}
      - {module: "sigil_ml.cli", form: "python -m sigil_ml.cli", sites: ["tests/test_cloud_training.py:1091,1106,1129,1148"], moving: false}
      - {module: "sigil_ml.models.*", form: "importlib.import_module(f'sigil_ml.models.{name}')", sites: ["tests/test_feature_store_defs.py:196"], moving: false}
      - {module: "sigil_ml (package)", form: 'collect_submodules("sigil_ml")', sites: ["freeze/kameas-ml.spec:269"], moving: false, note: "package-level; reaches datastore/ and modelstore/ without edit, but FR-006 requires a real build to confirm"}
    moving_modules_string_referenced: []

  # -------- T003 --------
  reconciliation:
    measured_by_planning: 41
    counted_by_this_map: 41
    difference: 0
    per_module:
      - {module: sigil_ml.store,           planning: 11, counted: 11, delta: 0}
      - {module: sigil_ml.storage,         planning: 22, counted: 22, delta: 0}
      - {module: sigil_ml.store_sqlite,    planning: 4,  counted: 4,  delta: 0}
      - {module: sigil_ml.store_postgres,  planning: 2,  counted: 2,  delta: 0}
      - {module: sigil_ml.loader,          planning: 1,  counted: 1,  delta: 0}
      - {module: sigil_ml.cache,           planning: 1,  counted: 1,  delta: 0}
    scope_of_the_41: "src/ and tests/ only, tracked files only, one row per import STATEMENT (a parenthesised multi-line import counts once)."
    what_the_41_excludes:
      - "29 import statements in kitty-specs/ (historical mission records, do_not_change)."
      - "The Sphinx :class: cross-reference at src/sigil_ml/feature_store/materialize.py:454 — a dotted module path, not an import. Recorded under code_symbols."
      - "__pycache__ and *.pyc — structurally excluded by searching tracked files only."
      - ".worktrees/feature-extraction-correctness-01KYTR7N-lane-a/ — an untracked sibling worktree a naive filesystem grep would double-count the entire repo through."
    verdict: >-
      Exact agreement, per-module and in total. Planning neither missed an
      import statement nor double-counted a line.

  # -------- findings planning did not anticipate --------
  findings:
    - id: F1
      severity: blocks-wp02-if-followed-literally
      category: code_symbols
      what: >-
        `create_model_store` does not exist. plan.md:92, quickstart.md:49 and
        WP02-tests-then-move.md:169 all instruct modelstore/__init__.py to
        export it. The real symbol is model_store_factory
        (storage/model_store.py:245, called at app.py:134 and cli.py:114).
      action: "WP02 exports model_store_factory. Renaming it would violate C-001 and FR-005."
    - id: F2
      severity: needs-a-decision
      category: filesystem_paths
      what: >-
        model-registry-and-base-refresh-01KYTW5S names src/sigil_ml/loader.py in
        MACHINE-READ fields — lanes.json:20 owned_files and WP05-integration.md
        frontmatter authoritative_surface/owned_files — not just prose. Stale
        after this mission.
      action: "Fix here or absorb there. The mission's exception is manual_review so neither is silent."
    - id: F3
      severity: informational
      category: logs_telemetry
      what: >-
        Five moving modules use logging.getLogger(__name__), so five emitted
        logger names change. Nothing in-repo depends on them and the root
        sigil_ml logger still captures all five, but it is the one observable
        change in a mission whose claim is that nothing changes.
      action: "Accept and record. Do not pin names by hand — that would be a real edit to satisfy an appearance."
    - id: F4
      severity: informational
      category: code_symbols
      what: >-
        src/sigil_ml/feature_store/materialize.py:454 carries a Sphinx
        :class:`~sigil_ml.store.DataStore` reference. Not an import, so outside
        the 41, and it fails silently (a dead doc link) rather than loudly. The
        only occurrence in a file WP02 has no other reason to open.
      action: "Rewrite to ~sigil_ml.datastore.DataStore."
    - id: F5
      severity: informational
      category: serialized_keys
      what: >-
        Nothing in packaging needs to change. pyproject.toml uses
        packages = ["src/sigil_ml"], the freeze spec uses
        collect_submodules("sigil_ml"), and .pyre_configuration points at the
        package directory. No per-module list exists anywhere.
      action: "No edit. FR-006/SC-004 still require an actual `make freeze` to confirm."
