[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution (`kenaz-ml`) and the import package (`kenaz_ml`) agree; they
# have not always, and this declaration is what keeps the build honest either
# way. Hatchling's default file selection looks for a top-level directory
# matching the project name and fails when it cannot find one, and these
# sources live under `src/`, so the wheel target is declared explicitly.
[tool.hatch.build.targets.wheel]
packages = ["src/kenaz_ml"]

[project]
name = "kenaz-ml"
version = "0.1.0"
description = "ML prediction sidecar for the Sigil developer intelligence daemon"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sigil Contributors" }]
keywords = ["developer-tools", "machine-learning", "productivity", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
    # Feast is PINNED EXACTLY (plan.md D-007). The registry we ship is a
    # serialized protobuf whose schema is coupled to the library version that
    # produced it; a floating specifier would make the shipped registry a
    # moving target across open-source installs and turn a version skew into a
    # deserialization traceback instead of the diagnostic FR-016 requires.
    # Do not relax this to >= or ~=.
    #
    # Measured and accepted cost (spec C-003, which supersedes the CLAUDE.md
    # dependency ceiling for Feast's dependency tree specifically):
    # +309 MB and +338 native libraries (137 MB/199 libs -> 446 MB/537 libs).
    #
    # No extra is specified: feast 0.65.0 publishes no `sqlite` extra (only
    # `sqlite-vec`, which is the vector-search store, not what the local
    # deployment uses). The SQLite online store the local config selects lives in
    # feast core at `feast.infra.online_stores.sqlite`, so plain `feast` already
    # provides it and `feast[sqlite]` would install nothing extra beyond emitting
    # an "unknown extra" warning.
    "feast==0.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]
# The cloud deployment swaps SQLite for PostgreSQL on both halves of the store
# (data-model.md §Deployment configuration). Same exact Feast pin as above —
# both deployments must read a registry written by the identical version.
cloud = ["psycopg2-binary>=2.9", "boto3>=1.34", "feast[postgres]==0.65.0"]
# FR-3 (ADR-ml-packaging.md): build-time-only deps for producing the frozen,
# self-contained `kenaz-ml` executable. NOT a runtime dependency — the frozen
# artifact carries only the runtime deps above (the CLAUDE.md "no heavyweight
# runtime deps" rule is preserved; PyInstaller runs at build time, not serve
# time).
freeze = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/kameas-ai/kenaz-ml"
Repository = "https://github.com/kameas-ai/kenaz-ml"
Issues = "https://github.com/kameas-ai/kenaz-ml/issues"
"Sigil Daemon" = "https://github.com/kameas-ai/sigil"

[project.scripts]
kenaz-ml = "kenaz_ml.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # Depends() in default args — standard FastAPI pattern
    "B905",   # zip without strict= (requires 3.10+, fine for us but noisy)
    "SIM102", # nested if — explicit guard clauses are clearer for lock patterns
    "SIM105", # contextlib.suppress — try/except pass is clearer in our codebase
    "SIM108", # ternary expression — multi-line if/else is more readable for us
    "SIM110", # any() instead of for loop — explicit loops are clearer for debugging
]

[tool.ruff.lint.isort]
known-first-party = ["kenaz_ml"]
